[package]
name = "lander-lunar"
version = "1.0.0"
description = "Lander Lunar"
authors = ["Lucca Bueno Cuzzolin"]
edition = "2021"

[lib]
name = "lander_lunar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
