<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lander Lunar</title>
<style>
/* Fontes embutidas: o app funciona sem internet */
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-style: normal; font-display: swap; src: url("fonts/ibm-plex-mono-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Michroma"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/michroma-latin-400-normal.woff2") format("woff2"); }

/* Layout: one screen. Canvas fills the page, instruments sit on top as a thin strip,
   mission messages appear in a panel at the bottom left so the terrain (or the star chart) stays visible. */
:root {
  color-scheme: dark;
  --void: #0c0e17;        /* sky */
  --regolith: #171a27;    /* ground mass, panels */
  --bone: #e9e4d6;        /* vector lines, text */
  --dim: #8b8fa3;         /* labels */
  --amber: #ffb454;       /* engine, pads, the one accent */
  --ok: #7fd6c2;
  --bad: #ff6b5e;
  --display: "Michroma", "Eurostile", "Trebuchet MS", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--void);
  color: var(--bone);
  font-family: var(--mono);
  font-size: 14px;
  overflow: hidden;
  position: relative;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* Instruments */
#hud {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; flex-wrap: wrap; gap: 6px 22px;
  padding: 14px 20px;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
#hud[hidden], .inst[hidden], #hud [hidden] { display: none; }
.inst { display: flex; flex-direction: column; gap: 2px; min-width: 74px; }
.inst .lbl { font-size: 10px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.inst .val { font-size: 17px; font-weight: 500; white-space: nowrap; }
.inst .val small { font-size: 11px; color: var(--dim); font-weight: 400; margin-left: 3px; }
.inst.ok .val { color: var(--ok); }
.inst.warn .val { color: var(--amber); }
.inst.bad .val { color: var(--bad); }
.spacer { flex: 1 1 0; min-width: 0; }
#fuelbar { width: 110px; height: 4px; background: #2a2e40; margin-top: 4px; }
#fuelfill { height: 100%; width: 100%; background: var(--amber); transform-origin: left; }
.inst.bad #fuelfill { background: var(--bad); }

/* Mission panel */
#panel {
  position: absolute; left: 20px; bottom: 20px;
  width: min(410px, calc(100% - 40px));
  max-height: calc(100% - 110px); overflow-y: auto;
  background: color-mix(in srgb, var(--regolith) 93%, transparent);
  border: 1px solid #353a50;
  border-left: 3px solid var(--amber);
  padding: 20px 22px;
  display: flex; flex-direction: column; gap: 13px;
}
#panel[hidden], #panel [hidden] { display: none; }
#panel.bad { border-left-color: var(--bad); }
#panel.ok { border-left-color: var(--ok); }
#panel h1 {
  font-family: var(--display); font-weight: 400;
  font-size: 21px; letter-spacing: .06em; line-height: 1.25;
  margin: 0; text-wrap: balance; text-transform: uppercase;
}
#panel p { margin: 0; line-height: 1.55; color: #c9c5ba; }
#panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
#panel dt { color: var(--dim); }
#panel dd { margin: 0; font-variant-numeric: tabular-nums; }
kbd {
  font-family: var(--mono); font-size: 12px;
  border: 1px solid #4a4f68; border-bottom-width: 2px;
  padding: 1px 6px; color: var(--bone); background: #1f2333;
}
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
button { font-family: var(--mono); cursor: pointer; }
#go {
  font-size: 14px; font-weight: 600; letter-spacing: .04em;
  color: var(--void); background: var(--amber);
  border: 0; padding: 11px 18px;
}
#go:hover { background: #ffc67a; }
#go small { font-weight: 400; opacity: .7; margin-left: 8px; }
#alt {
  font-size: 13px; color: var(--bone); background: transparent;
  border: 1px solid #4a4f68; padding: 10px 14px;
}
#alt:hover, #alt2:hover { border-color: var(--bone); }
#alt2 {
  font-size: 13px; color: var(--bone); background: transparent;
  border: 1px solid #4a4f68; padding: 10px 14px;
}
#upbar { width: 100%; height: 6px; background: #2a2e40; }
#upbar > div { height: 100%; width: 0; background: var(--amber); transition: width .15s; }
#choices { display: flex; flex-direction: column; gap: 8px; }
#choices .hint { font-size: 12px; color: var(--amber); }
.choice {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: baseline; text-align: left;
  background: #1f2333; color: var(--bone); border: 1px solid #4a4f68; padding: 9px 12px; font-size: 13px;
}
.choice:hover { border-color: var(--amber); }
.choice kbd { grid-row: span 2; align-self: center; }
.choice b { font-weight: 600; color: var(--amber); }
.choice span { color: #c9c5ba; font-size: 12px; }
button:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }

#tip, #banner {
  position: absolute; left: 50%; transform: translateX(-50%);
  width: max-content; max-width: min(600px, calc(100% - 40px));
  text-align: center; pointer-events: none; line-height: 1.45;
}
#tip { bottom: 50px; background: rgba(23,26,39,.9); border: 1px solid #353a50; padding: 9px 16px; font-size: 13px; }
#banner { top: 110px; font-size: 13px; color: #c9c5ba; transition: opacity .4s; }
#banner b { display: block; font-family: var(--display); font-weight: 400; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--bone); margin-bottom: 3px; }
#banner.off { opacity: 0; }
#legend { position: absolute; right: 20px; bottom: 18px; font-size: 11px; color: var(--dim); pointer-events: none; }
#tip[hidden], #legend[hidden] { display: none; }

/* Touch controls */
#touch { display: none; position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; justify-content: space-between; pointer-events: none; }
#touch .grp { display: flex; gap: 12px; }
.pad {
  pointer-events: auto;
  width: 68px; height: 68px;
  border: 1px solid #4a4f68; background: rgba(23,26,39,.75);
  color: var(--bone); font-size: 22px;
}
.pad.fire { width: 92px; color: var(--amber); border-color: var(--amber); font-size: 13px; letter-spacing: .08em; }
.pad.on { background: #2c3148; }
@media (pointer: coarse) {
  #touch { display: flex; }
  #touch[hidden] { display: none; }
  #panel { bottom: 104px; max-height: calc(100% - 200px); }
  #panel.low { bottom: 20px; max-height: calc(100% - 110px); }
  .keys-only { display: none !important; }
  #tip { bottom: 104px; }
}
@media (max-width: 520px) {
  #hud { gap: 6px 16px; padding: 10px 16px; }
  .inst { min-width: 70px; }
  .inst .val { font-size: 15px; }
  .spacer { display: none; }
  #legend { display: none; }
}
</style>
</head>
<body>
<canvas id="c" aria-label="Lander Lunar: área de jogo"></canvas>

<div id="hud">
  <div class="inst" id="iAlt"><span class="lbl">Altitude</span><span class="val"><span id="vAlt">0</span><small>m</small></span></div>
  <div class="inst" id="iVx"><span class="lbl">Lateral</span><span class="val"><span id="vVx">0,0</span><small>m/s<span id="vxMax"> · máx 4,0</span></small></span></div>
  <div class="inst" id="iVy"><span class="lbl">Descida</span><span class="val"><span id="vVy">0,0</span><small>m/s · máx <span id="vVyMax">6,5</span></small></span></div>
  <div class="inst" id="iAng"><span class="lbl">Inclinação</span><span class="val"><span id="vAng">0</span><small>°<span id="angMax"> · máx 12</span></small></span></div>
  <div class="inst" id="iFuel"><span class="lbl">Combustível</span><span class="val"><span id="vFuel">100</span><small id="vFuelMax">/ 100</small></span><div id="fuelbar"><div id="fuelfill"></div></div></div>
  <div class="inst" id="iWind" hidden><span class="lbl">Vento</span><span class="val"><span id="vWind">0,0</span><small>m/s²</small></span></div>
  <div class="inst" id="iObj" hidden><span class="lbl">Fotos</span><span class="val" id="vObj">0/2</span></div>
  <div class="spacer"></div>
  <div class="inst"><span class="lbl">Fase</span><span class="val" id="vLevel">Lua 1/2</span></div>
  <div class="inst" id="iLives"><span class="lbl">Naves</span><span class="val" id="vLives">3</span></div>
  <div class="inst"><span class="lbl">Pontos</span><span class="val" id="vScore">0</span></div>
  <div class="inst"><span class="lbl">Melhor</span><span class="val" id="vBest">0</span></div>
</div>

<div id="panel" role="dialog" aria-live="polite">
  <h1 id="pTitle">Lander Lunar</h1>
  <p id="pText"></p>
  <dl id="pList"></dl>
  <div id="choices" hidden></div>
  <div class="btns">
    <button id="go" type="button"><span id="goText">Continuar</span><small class="keys-only">Enter</small></button>
    <button id="alt" type="button" hidden></button>
    <button id="alt2" type="button" hidden></button>
  </div>
</div>

<div id="touch">
  <div class="grp">
    <button class="pad" id="tL" type="button" aria-label="Esquerda">◀</button>
    <button class="pad" id="tR" type="button" aria-label="Direita">▶</button>
  </div>
  <button class="pad fire" id="tF" type="button" aria-label="Ação principal">MOTOR</button>
</div>

<div id="banner" class="off" aria-live="polite"><b id="bTitle"></b><span id="bText"></span></div>
<div id="tip" hidden></div>
<div id="legend" class="keys-only" hidden></div>

<script>
(() => {
  'use strict';

  // ---------- Constantes ----------
  const H = 700;                 // altura do mundo (px lógicos)
  const M = 4;                   // px por metro (só para os instrumentos)
  const THRUST = 55;             // aceleração do motor do módulo (px/s²)
  const ROT = 2.6;               // velocidade de giro no modo normal (rad/s)
  const VX_BASE = 16;             // limite lateral de pouso (px/s) = 4,0 m/s
  const VY_MAX = 26;             // limite de descida           = 6,5 m/s
  const ANG_DEG = 12, ANG_MAX = ANG_DEG * Math.PI / 180;
  const FOOT_Y = 14;
  const MAPS = 2;                // mapas por fase
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse = matchMedia('(pointer: coarse)').matches;

  // ---------- Fases ----------
  // g em px/s² (a Lua é a referência; os outros seguem a gravidade real, comprimida para continuar jogável).
  // gen escolhe o gerador de terreno; w, rough, wind, meteor e erupt têm um valor por mapa.
  const MARS = { sky: '#140d0e', ground: '#2a1715', line: '#eaa88e' };
  const ASTROS = [
    { id: 'lua', name: 'Lua', sub: 'satélite da Terra', gReal: '1,62', g: 20, gen: 'lua', w: [1300, 1700], wind: [0, 0], drag: 0, meteor: [0, 0],
      pal: { sky: '#0c0e17', ground: '#171a27', line: '#e9e4d6' }, hazards: 'crateras',
      desc: 'Planícies cobertas de crateras, sem atmosfera e sem surpresas. O melhor lugar para aprender a pousar.' },
    { id: 'marte', name: 'Marte', sub: 'o planeta vermelho', gReal: '3,71', g: 27, gen: 'marte', w: [1500, 1900], wind: [7, 12], drag: 0, meteor: [0, 0],
      pal: MARS, hazards: 'gravidade forte, vento, cânion e mesas',
      desc: 'Mesas de topo plano, paredões e um cânion profundo. A gravidade puxa com força e rajadas de vento empurram a nave de lado.' },
    { id: 'europa', name: 'Europa', sub: 'lua de Júpiter', gReal: '1,31', g: 18, gen: 'europa', narrow: true, w: [1600, 2000], wind: [0, 0], drag: 0, meteor: [0, 0],
      pal: { sky: '#0a1118', ground: '#13232d', line: '#bfe3ee' }, hazards: 'fendas no gelo, gêiseres, plataformas estreitas',
      desc: 'Planície de gelo rachada por fendas. Gêiseres jorram das fendas de tempos em tempos e jogam a nave para cima.' },
    { id: 'tita', name: 'Titã', sub: 'lua de Saturno', gReal: '1,35', g: 18, gen: 'tita', w: [1700, 2100], wind: [12, 18], drag: 0.22, meteor: [0, 0],
      pal: { sky: '#15120b', ground: '#292312', line: '#dbd09c' }, hazards: 'atmosfera densa, vento forte, lagos de metano',
      desc: 'Dunas suaves e lagos de metano: quem pousa num lago afunda. O ar denso freia a nave e o vento é forte.' },
    { id: 'mercurio', name: 'Mercúrio', sub: 'vizinho do Sol', gReal: '3,70', g: 27, gen: 'mercurio', w: [1700, 2200], wind: [0, 0], drag: 0, meteor: [6.5, 4.8],
      pal: { sky: '#0e0e11', ground: '#1f1f24', line: '#cdcdd4' }, hazards: 'gravidade forte, meteoros, crateras fundas e escarpa',
      desc: 'Crateras fundas com pico central e uma escarpa que corta o mapa. Gravidade forte e chuva de meteoros.' },
    { id: 'io', name: 'Io', sub: 'lua de Júpiter', gReal: '1,80', g: 21, gen: 'io', narrow: true, w: [1900, 2400], wind: [6, 10], drag: 0, meteor: [0, 0], erupt: [5.5, 4],
      pal: { sky: '#12110a', ground: '#262510', line: '#e6e07c' }, hazards: 'vulcões em erupção, lagos de lava, vento',
      desc: 'O astro mais vulcânico do Sistema Solar: os vulcões lançam rochas para o alto e há lagos de lava entre eles.' },
  ];
  const site = (id, name, sub, gen, w, wind, hazards, desc) =>
    ({ id, name, sub, gReal: '3,71', g: 30, gen, w, wind, drag: 0, meteor: [0, 0], pal: MARS, hazards, desc });
  const HELI_SITES = [
    site('h-jezero', 'Jezero', 'campo de voo na cratera', 'jezero', [1500, 1900], [0, 4], 'nenhum',
      'Decole, fotografe os alvos pairando sobre eles e pouse em DESTINO. Cada aro atravessado vale +50.'),
    site('h-seitah', 'Séítah', 'campo de dunas', 'dunes', [1800, 2200], [6, 10], 'dunas, rajadas de vento',
      'Dunas onde o rover não passa: só o helicóptero chega. O vento empurra de lado.'),
    site('h-delta', 'Delta', 'falésias do antigo rio', 'mesa', [2000, 2400], [8, 13], 'falésias altas, vento forte',
      'Paredões do delta de um rio seco. Suba por cima das falésias e cuidado com as rajadas.'),
  ];
  const ROVER_SITES = [
    site('r-jezero', 'Jezero', 'piso da cratera', 'jezero', [2200, 2800], [0, 0], 'pedras rolando, lombadas',
      'Pedras rolam na sua direção: pule por cima delas. Pare sobre os pontos de coleta e leve as amostras ao DEPÓSITO.'),
    site('r-seitah', 'Séítah', 'campo de dunas', 'dunes', [2600, 3200], [0, 0], 'tempestade de areia, areia fofa',
      'Uma tempestade de areia vem atrás de você: não pare demais. Use as dunas como rampa; tempo no ar vale pontos.'),
    site('r-delta', 'Delta', 'rampas do antigo rio', 'mesa', [2600, 3200], [0, 0], 'fendas para saltar, pedras rolando',
      'Fendas largas cortam o caminho: pule na beirada. No segundo mapa, pedras rolam pelas rampas.'),
  ];
  const MODES = {
    lander: { name: 'Módulo de pouso', phases: ASTROS, unit: 'Naves', lost: 'Módulo perdido', chart: 'MAPA DE ASTROS',
      about: 'Pouse o módulo em seis astros, cada um com seu relevo e seus perigos.' },
    heli: { name: 'Ingenuity', phases: HELI_SITES, unit: 'Helis', lost: 'Helicóptero perdido', chart: 'INGENUITY · MARTE',
      about: 'Voe o helicóptero em Marte: fotografe os alvos e pouse no destino.' },
    rover: { name: 'Perseverance', phases: ROVER_SITES, unit: 'Rovers', lost: 'Rover perdido', chart: 'PERSEVERANCE · MARTE',
      about: 'Corra com o rover em Marte: pule pedras e fendas, colete amostras e fuja da tempestade.' },
  };

  const css = getComputedStyle(document.documentElement);
  const COL = {};
  for (const n of ['void', 'regolith', 'bone', 'dim', 'amber', 'ok', 'bad']) COL[n] = css.getPropertyValue('--' + n).trim();

  const $ = id => document.getElementById(id);
  const canvas = $('c'), ctx = canvas.getContext('2d');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const randint = (a, b) => Math.floor(rand(a, b + 1));
  const fmt = (v, d = 1) => v.toFixed(d).replace('.', ',');
  const num = v => Math.round(v).toLocaleString('pt-BR');

  const store = {
    get(k, d) { try { const v = localStorage.getItem('lander-lunar-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('lander-lunar-' + k, JSON.stringify(v)); } catch (e) {} },
  };

  // ---------- Progresso salvo ----------
  const freshSave = () => {
    const s = { modes: {}, up: { tank: 0, engine: 0, legs: 0, eco: 0, shield: 0, life: 0 } };
    for (const m in MODES) s.modes[m] = { unlocked: 1, best: {}, done: {} };
    return s;
  };
  function mergeSave(a, b) {           // fica com o progresso mais avançado de cada campo
    if (!b || typeof b !== 'object') return a;
    if (!b.modes && b.unlocked !== undefined) b = { modes: { lander: { unlocked: b.unlocked, best: b.best, done: b.done } }, up: b.up };   // formato antigo
    for (const m in MODES) {
      const x = a.modes[m], y = (b.modes && b.modes[m]) || {};
      x.unlocked = clamp(Math.max(x.unlocked, y.unlocked | 0), 1, MODES[m].phases.length);
      for (const k in (y.best || {})) x.best[k] = Math.max(x.best[k] || 0, y.best[k] || 0);
      for (const k in (y.done || {})) if (y.done[k]) x.done[k] = true;
    }
    for (const k in a.up) a.up[k] = Math.max(a.up[k], (b.up && b.up[k]) | 0);
    return a;
  }
  let save = mergeSave(freshSave(), store.get('campanha', null));
  const persist = () => store.set('campanha', save);
  const up = () => save.up;

  // ---------- Estado ----------
  let W = 1300, cw = 0, ch = 0, dpr = 1, scale = 1, viewW = 1300, hudH = 60;
  let state = 'title';           // title | map | play | paused | landed | crashed | over
  let mode = 'lander', astroIdx = 0, astro = ASTROS[0], mapIdx = 0, sel = 0;
  let lives = 3, score = 0;
  let diff = store.get('dif', store.get('dificil', false) ? 2 : 1);   // 0 fácil, 1 normal, 2 difícil
  if (![0, 1, 2].includes(diff)) diff = 1;
  let hard = diff === 2, easy = diff === 0;
  const DIFFS = [
    { name: 'Fácil', desc: 'Limites de pouso 25% maiores, 20% menos consumo, +1 unidade por fase, vento e perigos mais brandos. Pontos ×0,75.' },
    { name: 'Normal', desc: 'O jogo como foi pensado: controles com ajuda e guia de trajetória. Pontos ×1.' },
    { name: 'Difícil', desc: 'Giro com inércia, helicóptero sem nivelamento, rover com menos tração e sem guia de trajetória. Pontos ×1,5.' },
  ];
  let autoZoom = store.get('zoom', true) !== false;
  let tut = store.get('tut', null) || { lander: !!store.get('tutorial', false) };
  let seg = 22, heights = [], pads = [], stars = [], items = [], dust = [], zones = [], vents = [], targets = [], depot = null;
  let ship = null, frags = [], sparks = [], meteors = [], floats = [], choices = [], mapPos = [];
  let meteorT = 3, alarmT = 0, bannerT = 0, usedThrust = 0, usedTurn = 0, windPh = [0, 0], windPos = 0, stuckT = 0;
  const cam = { x: 650, y: H / 2, z: 1 };
  let shake = 0, stateTime = 0, lastGain = 0, time = 0, panShift = 0;
  let boulders = [], boulderT = 3, stormX = null, airT = 0, jumpBuf = 0;
  // o que anima cada local do rover: pedras rolando (intervalo em s) ou tempestade perseguindo (px/s), por mapa
  const ROVER_HAZ = { 'r-jezero': { boulder: [6.5, 4.2] }, 'r-seitah': { storm: [135, 155] }, 'r-delta': { boulder: [0, 5] } };
  const roverHaz = () => ROVER_HAZ[astro.id] || {};
  let goFn = null, altFn = null, alt2Fn = null;
  const keys = { left: false, right: false, thrust: false };

  const S = () => save.modes[mode];
  const phases = () => MODES[mode].phases;
  const gravity = () => mode === 'rover' ? 90 : astro.g;   // o rover usa gravidade de jogo de plataforma, para pulos rápidos
  const burnRate = () => (mode === 'lander' ? 5.6 : mode === 'heli' ? 4.3 : 2.8) * Math.pow(0.88, up().eco) * (easy ? 0.8 : 1);
  const thrust = () => (mode === 'heli' ? 70 : mode === 'rover' ? 110 : THRUST) * (1 + 0.1 * up().engine);
  const fuelMax = () => 100 + 20 * up().tank;
  const vyMax = () => (VY_MAX + 4 * up().legs) * (easy ? 1.25 : 1);
  const vxMax = () => VX_BASE * (easy ? 1.25 : 1);
  const impactMax = () => (210 + 25 * up().legs) * (easy ? 1.3 : 1);         // rover: batida que a suspensão aguenta (px/s)
  const maxLives = () => 3 + up().life + (easy ? 1 : 0);
  const scoreMult = () => hard ? 1.5 : easy ? 0.75 : 1;
  const footX = () => mode === 'heli' ? 10 : 12;
  const windMax = () => mode === 'rover' ? 0 : astro.wind[mapIdx] * (easy ? 0.6 : 1);

  // ---------- Melhorias: uma por mapa, na primeira vez que ele é concluído; valem para sempre e em todos os modos ----------
  const UPG = [

  // ---------- Som ----------
  let actx = null, engineGain = null, noiseBuf = null, lpNode = null, muted = false;
  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume().catch(() => {}); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      actx = new AC();
      noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < d.length; i++) {            // ruído marrom
        last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
        d[i] = last * 3.5;
      }
      const src = actx.createBufferSource();
      src.buffer = noiseBuf; src.loop = true;
      const lp = actx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 520; lpNode = lp;
      engineGain = actx.createGain(); engineGain.gain.value = 0;
      src.connect(lp).connect(engineGain).connect(actx.destination);
      src.start();
    } catch (e) { actx = null; }
  }
  function setEngine(level, freq = 520) {
    if (!actx || !engineGain) return;
    const g = muted ? 0 : level;
    if (g === lastGain) return;
    lastGain = g;
    lpNode.frequency.setTargetAtTime(freq, actx.currentTime, 0.05);
    engineGain.gain.setTargetAtTime(g, actx.currentTime, 0.04);
  }
  function beep(freq, dur, when = 0) {
    if (!actx || muted) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    const t = actx.currentTime + when;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.07, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function boom(vol = 0.9) {
    if (!actx || muted) return;
    const src = actx.createBufferSource(); src.buffer = noiseBuf;
    const g = actx.createGain(); const t = actx.currentTime;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    src.connect(g).connect(actx.destination);
    src.start(t); src.stop(t + 1.2);
  }

  // ---------- Avisos ----------
  function showBanner(title, text, secs = 4) {

  function levelIntro() {

  function setTip(t) {

  function updateTip() {

    if (mode === 'rover') {

      if (ship.x > depot.x0 && targetsLeft()) return setTip('Faltam amostras: volte aos pontos de coleta marcados no radar.');
      if (learning) {

        if (usedThrust < 1) return setTip(coarse ? 'Toque em PULO para saltar pedras e pegar estrelas.' : 'Aperte ↑ (ou Espaço) para pular pedras e pegar estrelas.');

      const onDest = ship.grounded && pads.some(p => p.kind === 'dest' && ship.x > p.x0 && ship.x < p.x1);
      if (onDest && targetsLeft()) return setTip('Faltam fotos: decole e paire dentro dos círculos tracejados.');
      if (ship.grounded && ship.fuel < fuelMax() - 1 && usedThrust > 1) return setTip('Pousado: o painel solar está recarregando a bateria.');

        if (usedTurn < 0.3) return setTip((coarse ? 'Incline com ◀ ▶' : 'Incline com ← →') + (hard ? '.' : '; ao soltar, o helicóptero se nivela sozinho.'));
        if (targetsLeft()) return setTip('Paire dentro do círculo tracejado até a foto completar.');
        return setTip('Fotos feitas: pouse devagar em DESTINO. Pousar em chão plano recarrega a bateria.');
      }
      if (ship.y < -20) return setTip('O helicóptero saiu por cima da tela; a seta mostra onde ele está.');

    if (learning) {

      if (usedTurn < 0.3) return setTip(coarse ? 'Use ◀ ▶ para inclinar: o motor empurra a nave para o lado em que ela aponta.' : 'Incline com ← → : o motor empurra a nave para o lado em que ela aponta.');
      if (alt > 200) return setTip(hard ? 'Leve a nave até uma plataforma laranja. As mais estreitas valem mais pontos.' : 'Os pontinhos mostram a queda com o motor desligado. Leve o X até uma plataforma laranja.');

    }
    if (ship.y < -20) return setTip('A nave saiu por cima da tela; a seta mostra onde ela está.');
    setTip('');
  }

  // ---------- Terreno: um gerador por tipo de relevo ----------
  function genTerrain(N) {
    const h = new Array(N + 1), g = astro.gen, second = mapIdx === 1;
    const p1 = rand(0, 6.28), p2 = rand(0, 6.28), p3 = rand(0, 6.28);
    const noise = a => rand(-a, a);
    const ventIdx = [];
    for (let i = 0; i <= N; i++) {
      if (g === 'lua' || g === 'mercurio') h[i] = 105 + 38 * Math.sin(i * 0.07 + p1) + 14 * Math.sin(i * 0.29 + p2) + noise(g === 'lua' ? 5 : 10);
      else if (g === 'marte' || g === 'mesa') h[i] = Math.round((150 + 85 * Math.sin(i * 0.05 + p1) + 48 * Math.sin(i * 0.14 + p2)) / 48) * 48 + noise(4);   // degraus: mesas e paredões
      else if (g === 'europa') h[i] = 125 + 16 * Math.sin(i * 0.09 + p1) + noise(5);                 // planície de gelo
      else if (g === 'tita' || g === 'dunes') { const s = Math.sin(i * 0.095 + p1), e = Math.sin(i * 0.031 + p2); h[i] = 80 + 95 * s * s * (0.6 + 0.4 * e * e) + 9 * Math.sin(i * 0.33 + p3) + noise(2); }   // dunas lisas
      else if (g === 'io') h[i] = 62 + 14 * Math.sin(i * 0.12 + p1) + noise(7);                      // planície baixa entre vulcões
      else h[i] = 100 + 30 * Math.sin(i * 0.08 + p1) + 13 * Math.sin(i * 0.22 + p2) + noise(4);     // jezero: piso de cratera
    }
    const crater = (c, r, d, peak) => {               // bacia com borda levantada e, nas grandes, pico central
      for (let j = Math.max(1, c - r - 2); j <= Math.min(N - 1, c + r + 2); j++) {
        const t = Math.abs(j - c) / r;
        if (t < 1) h[j] -= d * (1 - t * t); else if (t < 1.5) h[j] += d * 0.6 * (1.5 - t);
      }
      if (peak) h[c] += d * 0.45;
    };
    if (g === 'lua' || g === 'mercurio' || g === 'jezero') {
      const count = Math.round(N / (g === 'jezero' ? 24 : 11));
      for (let k = 0; k < count; k++) {
        const r = randint(2, g === 'mercurio' ? 7 : 5), c = randint(r + 3, N - r - 3);
        crater(c, r, r * (g === 'mercurio' ? 13 : g === 'jezero' ? 5 : 12) + (second ? 6 : 0), g === 'mercurio' && r >= 5);
      }
    }
    if (g === 'mercurio') {                           // escarpa: um degrau alto que corta o mapa
      const c = randint(Math.floor(N * 0.3), Math.floor(N * 0.7)), left = Math.random() < 0.5;
      for (let j = 0; j <= N; j++) if (left ? j < c : j > c) h[j] += 85;
    }
    if (g === 'marte') {                              // cânion
      const wd = randint(6, 9), c = randint(Math.floor(N * 0.25), Math.floor(N * 0.75) - wd);
      for (let j = c; j < c + wd; j++) h[j] = 36 + noise(4);
    }
    if (g === 'europa') {                             // fendas fundas, pináculos de gelo e gêiseres
      let i = randint(4, 8);
      while (i < N - 4) {
        const d = rand(60, 105) + (second ? 15 : 0);
        h[i] -= d; h[i + 1] -= d * rand(0.3, 0.9);
        if (Math.random() < 0.5) ventIdx.push(i);
        const sp = i + randint(2, 4);
        if (sp < N - 3 && Math.random() < 0.6) h[sp] += rand(28, 60);
        i += randint(6, 10);
      }
    }
    if (g === 'io') {                                 // cones vulcânicos com caldeira
      const cones = second ? 3 : 2;
      for (let k = 0; k < cones; k++) {
        const c = Math.round(N * (k + 0.5 + rand(-0.2, 0.2)) / cones), wd = randint(6, 9), hc = rand(150, 215);
        for (let j = Math.max(1, c - wd); j <= Math.min(N - 1, c + wd); j++) h[j] += hc * Math.pow(1 - Math.abs(j - c) / wd, 1.25);
        h[c] -= 34; ventIdx.push(c);
      }
    }
    for (let i = 0; i <= N; i++) h[i] = clamp(h[i], 28, H * 0.6);
    return { h, ventIdx };
  }
  function limitSlope(h, m) {                          // transforma paredões em rampas que o rover consegue subir
    for (let i = 0; i < h.length - 1; i++) h[i + 1] = Math.min(h[i + 1], h[i] + m);
    for (let i = h.length - 2; i >= 0; i--) h[i] = Math.min(h[i], h[i + 1] + m);
  }

  function buildLevel() {
    resize();
    W = Math.max(Math.ceil(viewW), astro.w[mapIdx]);
    const N = Math.round(W / 22);
    seg = W / N;
    const { h, ventIdx } = genTerrain(N);
    heights = h; pads = []; zones = []; vents = []; targets = []; depot = null; items = [];
    const taken = [];                                  // faixas de índices já ocupadas
    const isFree = (a, b) => a > 1 && b < N - 1 && !taken.some(t => a <= t[1] && b >= t[0]);
    const flat = (a, b, v) => { for (let k = a; k <= b; k++) h[k] = v; };
    const second = mapIdx === 1;

    if (mode === 'lander') {
      // três plataformas, uma em cada terço do mapa
      const mults = [1, 2, 5].sort(() => Math.random() - 0.5);
      for (let j = 0; j < 3; j++) {
        const mult = mults[j];
        let len = mult === 1 ? 5 : mult === 2 ? 4 : 3;
        if (astro.narrow || second) len = Math.max(2, len - 1);
        const a = Math.floor(N * j / 3) + 2, b = Math.floor(N * (j + 1) / 3) - 2 - len;
        const start = randint(a, Math.max(a, b));
        flat(start, start + len, h[start + (len >> 1)]);
        pads.push({ x0: start * seg, x1: (start + len) * seg, y: H - h[start], mult, label: '×' + mult });
        taken.push([start - 2, start + len + 2]);
      }
      for (const v of ventIdx) if (isFree(v - 1, v + 1)) { vents.push({ i: v, type: astro.gen === 'io' ? 'volcano' : 'geyser', ph: rand(0, 6.5) }); taken.push([v - 2, v + 2]); }
      // lagos de metano (Titã) e de lava (Io)
      const liquid = astro.gen === 'tita' ? 'lake' : astro.gen === 'io' ? 'lava' : null;
      if (liquid) {
        let want = second ? 3 : 2, tries = 0;
        while (want > 0 && tries++ < 200) {
          const len = randint(4, 7), s = randint(2, N - len - 2);
          if (!isFree(s - 1, s + len + 1)) continue;
          const slice = h.slice(s, s + len + 1);
          if (liquid === 'lava' && Math.max(...slice) > 125) continue;
          flat(s, s + len, Math.min(...slice));
          zones.push({ x0: s * seg + 2, x1: (s + len) * seg - 2, type: liquid });
          taken.push([s - 1, s + len + 1]); want--;
        }
      }
    } else if (mode === 'heli') {
      flat(2, 6, h[4]); flat(N - 7, N - 3, h[N - 5]);
      pads.push({ x0: 2.5 * seg, x1: 5.5 * seg, y: H - h[4], kind: 'base', label: 'BASE' });
      pads.push({ x0: (N - 6.5) * seg, x1: (N - 3.5) * seg, y: H - h[N - 5], kind: 'dest', label: 'DESTINO' });
      const n = second ? 3 : 2;
      for (let k = 0; k < n; k++) targets.push({ x: seg * Math.round(N * ((k + 1) / (n + 1) + rand(-0.06, 0.06))), done: false, prog: 0 });
      const rn = second ? 5 : 4;                        // aros no caminho
      for (let k = 0; k < rn; k++) {
        const x = seg * Math.round(N * (0.14 + 0.72 * (k + 0.5) / rn + rand(-0.03, 0.03)));
        items.push({ type: 'ring', x, y: Math.max(120, terrainY(x) - rand(125, 215)), got: false, p: rand(0, 6.28) });
      }
    } else {                                           // rover
      if (astro.gen !== 'mesa') for (let i = 1; i < N; i++) h[i] = (h[i - 1] + 2 * h[i] + h[i + 1]) / 4;
      const maxStep = seg * (astro.gen === 'dunes' ? 0.36 : 0.5);
      limitSlope(h, maxStep);
      flat(0, 6, h[3]); flat(N - 7, N, h[N - 4]);
      taken.push([0, 8], [N - 9, N]);
      depot = { x0: (N - 5) * seg, x: (N - 3) * seg };
      const n = second ? 3 : 2;
      for (let k = 0; k < n; k++) {
        const i = Math.round(N * ((k + 1) / (n + 1) * 0.8 + 0.1 + rand(-0.04, 0.04)));
        flat(i - 1, i + 1, h[i]);
        targets.push({ x: i * seg, done: false, prog: 0 }); taken.push([i - 3, i + 3]);
      }
      if (astro.gen !== 'mesa') limitSlope(h, maxStep);
      if (astro.gen === 'jezero') {                    // pedras: lombadas curtas
        for (let i = 10; i < N - 10; i += randint(6, 10)) if (isFree(i, i)) h[i] += rand(9, 15) + (second ? 4 : 0);
      } else if (astro.gen === 'dunes') {              // areia fofa nos vales
        let want = second ? 4 : 3, tries = 0;
        while (want > 0 && tries++ < 200) {
          const len = randint(4, 6), s = randint(9, N - len - 10);
          if (!isFree(s, s + len)) continue;
          zones.push({ x0: s * seg, x1: (s + len) * seg, type: 'sand' }); taken.push([s - 1, s + len + 1]); want--;
        }
      } else {                                         // delta: fendas para saltar, com pista de embalo antes
        let want = second ? 4 : 3, tries = 0;
        while (want > 0 && tries++ < 300) {
          const p = randint(16, N - 16);
          if (!isFree(p - 7, p + 8)) continue;
          const v = h[p - 3];
          flat(p - 7, p, v); h[p + 1] = h[p + 2] = Math.max(20, v - 85); flat(p + 3, p + 8, v - 14);
          zones.push({ x0: p * seg + 3, x1: (p + 3) * seg - 3, type: 'pit' }); taken.push([p - 8, p + 9]); want--;
        }
        limitSlopeOutside(h, seg * 0.5);
      }
    }

    stars = [];
    const count = Math.round((W + 1400) / 8);
    for (let i = 0; i < count; i++) {
      stars.push({ x: rand(-700, W + 700), y: rand(-350, H * 0.8), r: Math.random() < 0.12 ? 1.4 : 0.8, p: rand(0, 6.28), tw: Math.random() < 0.25 });
    }
    dust = [];
    for (let i = 0; i < 46; i++) dust.push({ a: Math.random(), y: rand(20, H * 0.82), s: rand(0.5, 1.4) });
    windPh = [rand(0, 6.28), rand(0, 6.28)];

    // itens: estrelas (pontos) e cápsulas F (combustível / energia)
    const n = W > 1800 ? 2 : 1;
    const put = type => {
      let x = rand(120, W - 120), tries = 0;
      while (tries++ < 20 && zones.some(z => x > z.x0 - 30 && x < z.x1 + 30)) x = rand(120, W - 120);
      const y = mode === 'rover' ? terrainY(x) - (type === 'gem' ? rand(42, 64) : 16) : Math.max(110, terrainY(x) - rand(140, 300));
      items.push({ type, x, y, got: false, p: rand(0, 6.28) });
    };
    for (let i = 0; i < (mode === 'rover' ? (second ? 9 : 7) : n); i++) put('gem');
    if (mode === 'rover' || (mode === 'lander' && !(astro.id === 'lua' && mapIdx === 0))) for (let i = 0; i < n; i++) put('fuel');
  }
  // como limitSlope, mas preserva as fendas
  function limitSlopeOutside(h, m) {
    const inPit = i => zones.some(z => z.type === 'pit' && i * seg >= z.x0 - seg && i * seg <= z.x1 + seg);
    for (let i = 0; i < h.length - 1; i++) if (!inPit(i) && !inPit(i + 1)) h[i + 1] = Math.min(h[i + 1], h[i] + m);
    for (let i = h.length - 2; i >= 0; i--) if (!inPit(i) && !inPit(i + 1)) h[i] = Math.min(h[i], h[i + 1] + m);
  }
  function terrainY(x) {
    x = clamp(x, 0, W - 0.001);
    const i = Math.floor(x / seg), t = x / seg - i;
    return H - (heights[i] * (1 - t) + heights[i + 1] * t);
  }
  const zoneAt = (x, type) => zones.find(z => z.type === type && x > z.x0 && x < z.x1);
  const liquidAt = x => zoneAt(x, 'lake') || zoneAt(x, 'lava');

  // ---------- Veículo ----------
  function spawnShip() {
    const base = { a: 0, av: 0, vx: 0, vy: 0, fuel: fuelMax(), shield: mode === 'lander' ? up().shield : 0, thrusting: false, alive: true, grounded: false, drill: false, rpm: 0, rot: 0 };
    if (mode === 'lander') {
      const side = Math.random() < 0.5 ? -1 : 1;
      ship = Object.assign(base, { x: W / 2 - side * W * rand(0.2, 0.36), y: 70, vx: side * rand(14, 22 + mapIdx * 6) });
    } else if (mode === 'heli') {
      const p = pads[0];
      ship = Object.assign(base, { x: (p.x0 + p.x1) / 2, y: p.y - FOOT_Y, grounded: true });
    } else {
      ship = Object.assign(base, { x: seg * 3, y: terrainY(seg * 3), grounded: true });
    }
    frags = []; sparks = []; meteors = []; floats = [];
    for (const it of items) if (it.type === 'fuel') it.got = false;   // cápsulas voltam a cada tentativa
    meteorT = 3.5; alarmT = 0; stuckT = 0;
    boulders = []; boulderT = 2.5; airT = 0; jumpBuf = 0;
    stormX = mode === 'rover' && roverHaz().storm ? -300 : null;
    cam.z = 1; aimCamera();
  }
  function shipPoint(lx, ly) {
    const c = Math.cos(ship.a), s = Math.sin(ship.a);
    return { x: ship.x + lx * c - ly * s, y: ship.y + lx * s + ly * c };
  }
  const bodyY = () => mode === 'rover' ? ship.y - 12 : ship.y;       // centro do veículo, para colisões e coletas

  function updateHazards(dt) {
    // meteoros que caem do céu
    const slow = easy ? 1.4 : 1;
    const every = astro.meteor[mapIdx] * slow;
    const erupt = (astro.erupt ? astro.erupt[mapIdx] : 0) * slow;
    if (every || erupt) {
      meteorT -= dt;
      if (meteorT <= 0) {
        meteorT = (every || erupt) * rand(0.7, 1.3);
        if (every) {
          const dir = Math.random() < 0.5 ? -1 : 1, sp = rand(90, 140);
          meteors.push({ x: ship.x + rand(-520, 520) - dir * 220, y: -40, vx: dir * sp * 0.55, vy: sp, r: rand(4, 7), a: rand(0, 6.28) });
        } else if (vents.length) {                     // erupção: rochas sobem da caldeira e caem
          const v = vents[randint(0, vents.length - 1)], vx = v.i * seg, vy = terrainY(vx);
          for (let k = 0; k < randint(1, 2); k++) meteors.push({ x: vx, y: vy - 8, vx: rand(-55, 55), vy: -rand(120, 172), r: rand(4, 6.5), a: rand(0, 6.28), grav: true });
          for (let i = 0; i < 14; i++) sparks.push({ x: vx + rand(-6, 6), y: vy - 4, vx: rand(-40, 40), vy: -rand(60, 190), life: rand(0.4, 1), t: 0 });
          if (Math.abs(vx - ship.x) < viewW) boom(0.25);
        }
      }
    }
    for (const m of meteors) {
      if (m.grav) m.vy += gravity() * dt;
      m.x += m.vx * dt; m.y += m.vy * dt; m.a += dt * 3;
      if (m.x > 0 && m.x < W && m.vy > 0 && m.y >= terrainY(m.x)) {
        m.dead = true; burst(m.x, m.y - 2, astro.pal.line);
      } else if (state === 'play' && Math.hypot(m.x - ship.x, m.y - ship.y) < m.r + 11) {
        m.dead = true;
        if (ship.shield) {
          ship.shield = 0; burst(m.x, m.y, COL.ok); boom(0.4); beep(300, 0.2);
          ship.vx += m.vx * 0.15; ship.vy += m.vy * 0.1;
          showBanner('', 'O escudo absorveu o impacto.', 2);
        } else crash([[m.grav ? 'atingido por uma rocha vulcânica' : 'atingido por um meteoro', m.grav ? 'As rochas saem das caldeiras dos vulcões: evite voar por cima delas. A melhoria Escudo absorve um impacto por tentativa.' : 'Meteoros deixam um rastro laranja e aparecem no radar. A melhoria Escudo absorve um impacto por tentativa.']]);
      }
    }
    meteors = meteors.filter(m => !m.dead && m.y < H + 60);

    // gêiseres: jorram por 2 s a cada 6,5 s e empurram a nave para cima
    for (const v of vents) {
      if (v.type !== 'geyser') continue;
      const vx = v.i * seg, vy = terrainY(vx), tt = (time + v.ph) % 6.5;
      if (tt < 2) {
        for (let k = 0; k < 3; k++) sparks.push({ x: vx + rand(-5, 5), y: vy - 2, vx: rand(-22, 22), vy: -rand(170, 330), life: rand(0.5, 0.95), t: 0, c: astro.pal.line });
        const dy = vy - ship.y;
        if (state === 'play' && Math.abs(ship.x - vx) < 30 && dy > 0 && dy < 290) {
          const f = 1 - dy / 290;
          ship.vy -= 100 * f * dt; ship.vx += rand(-40, 40) * f * dt;
        }
      } else if (tt > 5.6 && Math.random() < 0.5) {    // aviso: borbulha antes de jorrar
        sparks.push({ x: vx + rand(-4, 4), y: vy - 2, vx: rand(-10, 10), vy: -rand(20, 50), life: 0.4, t: 0, c: astro.pal.line });
      }
    }
  }
  function burst(x, y, c) {
    for (let i = 0; i < 9; i++) sparks.push({ x, y, vx: rand(-80, 80), vy: -rand(10, 80), life: rand(0.3, 0.7), t: 0, c });
  }
  function addScore(pts, x, y, label) {
    pts = Math.round(pts * scoreMult());
    score += pts;
    floats.push({ x, y, text: '+' + pts + (label ? ' ' + label : ' pontos'), c: COL.bone, t: 0 });
  }
  function collectItems() {
    const by = bodyY();
    for (const it of items) {
      if (it.got || Math.hypot(it.x - ship.x, it.y - by) > 26) continue;
      it.got = true;
      if (it.type === 'fuel') {
        ship.fuel = Math.min(fuelMax(), ship.fuel + 30);
        floats.push({ x: it.x, y: it.y, text: mode === 'rover' ? '+30 energia' : '+30 combustível', c: COL.amber, t: 0 });
        beep(520, 0.1); beep(780, 0.12, 0.1);
      } else if (it.type === 'ring') {
        addScore(50, it.x, it.y, 'aro'); beep(880, 0.06); beep(1320, 0.1, 0.06);
        for (let i = 0; i < 12; i++) { const an = i * 0.5236; sparks.push({ x: it.x + Math.cos(an) * 20, y: it.y + Math.sin(an) * 20, vx: Math.cos(an) * 60, vy: Math.sin(an) * 60, life: 0.4, t: 0 }); }
      } else { addScore(mode === 'rover' ? 50 : 150, it.x, it.y); beep(1040, 0.08); beep(1560, 0.14, 0.08); }
    }
  }

  // ---------- Câmera ----------
  // Sem zoom: enquadra o mapa (rolando de lado em mapas largos).
  // Perto do chão: aproxima aos poucos e centraliza no veículo, inclusive junto às bordas do mapa.
  function aimCamera() {
    const half = viewW / 2;
    const bx = W <= viewW ? W / 2 : clamp(ship.x, half, W - half);
    const t = clamp(cam.z - 1, 0, 1);
    const fy = Math.min(ship.y + (mode === 'rover' ? -40 : 25), H - H / (2 * cam.z) + 50);
    cam.x = bx + (ship.x - bx) * t + (mode === 'rover' ? 90 * t : 0);   // o rover olha um pouco à frente
    cam.y = H / 2 + (fy - H / 2) * t;
  }
  function updateCamera(dt) {
    let zt = 1;
    if (autoZoom && state !== 'title') {
      if (mode === 'rover') zt = 1.4;
      else zt = clamp(1 + (270 - (terrainY(ship.x) - (ship.y + FOOT_Y))) / 180, 1, 2);   // 270 px de altura: sem zoom; 90 px: zoom total
    }
    cam.z += (zt - cam.z) * Math.min(1, dt * (REDUCED ? 30 : 2.6));
    aimCamera();
    // com o painel aberto depois de um pouso ou queda, desloca a vista para o veículo não ficar atrás dele
    const open = !panel.hidden && (state === 'landed' || state === 'crashed' || state === 'over') && !coarse;
    const want = open ? Math.max(0, (panel.offsetWidth + 40 - cw * 0.18) / 2) : 0;
    panShift += (want - panShift) * Math.min(1, dt * 3);
    cam.x -= panShift * clamp(cam.z - 1, 0, 1) / (scale * cam.z);
  }

  // ---------- Simulação ----------
  function update(dt) {
    time += dt; stateTime += dt;
    if (state === 'map') return;
    if (state === 'play') {
      if (mode === 'rover') updateRover(dt); else updateFlyer(dt);
    } else setEngine(0);
    windPos += windNow() * dt * 9;
    for (const s of sparks) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; }
    sparks = sparks.filter(s => s.t < s.life);
    for (const f of floats) { f.t += dt; f.y -= 22 * dt; }
    floats = floats.filter(f => f.t < 1.5);
    for (const f of frags) {
      f.t += dt; f.vy += gravity() * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.a += f.va * dt;
      const gy = terrainY(f.x);
      if (f.y > gy) { f.y = gy; f.vy *= -0.3; f.vx *= 0.6; f.va *= 0.5; }
    }
    updateCamera(dt);
    shake = Math.max(0, shake - dt * 2);
  }

  // módulo de pouso e helicóptero
  function updateFlyer(dt) {
    const heli = mode === 'heli';
    const turn = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    ship.thrusting = keys.thrust && ship.fuel > 0;
    if (turn) usedTurn += dt;
    if (ship.thrusting) usedThrust += dt;

    if (heli) {                                        // os rotores aceleram e desaceleram aos poucos
      const want = ship.thrusting ? 1 : ship.grounded ? 0 : 0.3;
      ship.rpm += (want - ship.rpm) * Math.min(1, dt * (ship.thrusting ? 7 : 2.5));
      ship.rot += ship.rpm * 30 * dt;
      setEngine(Math.round(ship.rpm * 8) / 8 * 0.32, 240 + 560 * ship.rpm);
    }
    if (heli && ship.grounded) {                       // pousado: recarrega no painel solar até decolar
      if (ship.thrusting && ship.rpm > 0.55) { ship.grounded = false; ship.vy = -10; }
      else { if (!ship.thrusting) ship.fuel = Math.min(fuelMax(), ship.fuel + 7 * dt); updatePhotos(dt); return; }
    }
    const pw = heli ? (ship.thrusting ? ship.rpm : 0) : 1;

    if (heli) {
      ship.a += turn * 2.2 * dt;
      if (!turn && !hard) ship.a -= Math.sign(ship.a) * Math.min(Math.abs(ship.a), 1.7 * dt);   // nivela sozinho
      ship.a = clamp(ship.a, -0.6, 0.6);
    } else {
      if (hard) { ship.av += turn * 7 * dt; ship.av *= Math.exp(-0.7 * dt); ship.a += ship.av * dt; }   // giro com inércia
      else ship.a += turn * ROT * dt;
      if (Math.abs(ship.a) > Math.PI / 2) { ship.a = clamp(ship.a, -Math.PI / 2, Math.PI / 2); ship.av = 0; }
    }

    let ax = windNow(), ay = gravity();
    if (ship.thrusting) {
      ax += Math.sin(ship.a) * thrust() * pw;
      ay -= Math.cos(ship.a) * thrust() * pw;
      ship.fuel = Math.max(0, ship.fuel - burnRate() * pw * dt);
      if (!heli && Math.random() < 0.6) {
        const n = shipPoint(0, 12);
        sparks.push({ x: n.x, y: n.y, vx: -Math.sin(ship.a) * 70 + rand(-14, 14) + ship.vx, vy: Math.cos(ship.a) * 70 + rand(-14, 14) + ship.vy, life: rand(0.25, 0.5), t: 0 });
      }
    }
    ship.vx += ax * dt; ship.vy += ay * dt;
    const drag = heli ? 0.35 : astro.drag;
    if (drag) { const k = Math.exp(-drag * dt); ship.vx *= k; ship.vy *= k; }
    ship.x += ship.vx * dt; ship.y += ship.vy * dt;
    if (ship.x < 14) { ship.x = 14; ship.vx = Math.max(ship.vx, 0); }
    if (ship.x > W - 14) { ship.x = W - 14; ship.vx = Math.min(ship.vx, 0); }
    if (ship.y < -260) { ship.y = -260; ship.vy = Math.max(ship.vy, 0); }
    if (!heli) {
      setEngine(ship.thrusting ? 0.5 : 0);
      if (turn && Math.random() < 0.5) {               // jatinhos de manobra
        const q = shipPoint(-turn * 9, -9);
        sparks.push({ x: q.x, y: q.y, vx: ship.vx - turn * Math.cos(ship.a) * 60, vy: ship.vy - turn * Math.sin(ship.a) * 60, life: 0.18, t: 0, c: COL.bone });
      }
    }

    collectItems();
    if (heli) updatePhotos(dt);

    // poeira levantada perto do chão
    const altNow = terrainY(ship.x) - (ship.y + FOOT_Y);
    if (ship.thrusting && altNow < 55 && Math.random() < 0.7) {
      const gx = clamp(ship.x - Math.sin(ship.a) * (altNow + 14), 0, W), dir = Math.random() < 0.5 ? -1 : 1;
      sparks.push({ x: gx, y: terrainY(gx) - 1, vx: dir * rand(40, 120), vy: -rand(4, 26), life: rand(0.4, 0.9), t: 0, c: COL.dim });
    }
    if (ship.fuel > 0 && ship.fuel < 20) { alarmT -= dt; if (alarmT <= 0) { beep(440, 0.07); alarmT = 0.9; } }
    updateHazards(dt);
    if (state === 'play') checkContact();
  }

  function updatePhotos(dt) {
    for (const t of targets) {
      if (t.done) continue;
      const cy = terrainY(t.x) - 75;
      if (Math.hypot(ship.x - t.x, ship.y - cy) < 64) {
        t.prog += dt / 0.9;
        if (t.prog >= 1) {
          t.done = true; addScore(100, t.x, cy, 'foto'); beep(1300, 0.05); beep(900, 0.08, 0.07);
          if (!targetsLeft()) showBanner('', 'Fotos completas: pouse em DESTINO.', 3.5);
        }
      } else t.prog = Math.max(0, t.prog - dt * 0.3);
    }
  }

  function checkContact() {
    const fx = footX(), heli = mode === 'heli';
    const fl = shipPoint(-fx, FOOT_Y), fr = shipPoint(fx, FOOT_Y);
    const pts = heli ? [fl, fr, shipPoint(0, -11), shipPoint(-15, -10), shipPoint(15, -10)] : [fl, fr, shipPoint(0, -12), shipPoint(-9, -2), shipPoint(9, -2)];
    let hit = false;
    for (const p of pts) if (p.y >= terrainY(p.x)) { hit = true; break; }
    if (!hit) return;

    const liq = liquidAt(ship.x);
    if (liq) return crash([liq.type === 'lake'
      ? ['afundou num lago de metano', 'Os lagos de Titã aparecem em azul-esverdeado. Pouse só nas plataformas laranja.']
      : ['caiu num lago de lava', 'A lava aparece em laranja-vivo no chão, entre os vulcões. Pouse só nas plataformas.']]);
    const pad = pads.find(p => fl.x >= p.x0 - 1 && fr.x <= p.x1 + 1);
    const slope = Math.abs(terrainY(ship.x + fx) - terrainY(ship.x - fx)) / (2 * fx);
    const problems = [];
    if (!heli && !pad) problems.push(['fora da plataforma', 'Só as faixas laranja contam, e as duas sapatas precisam ficar em cima da plataforma.']);
    if (heli && slope > 0.4) problems.push(['terreno inclinado demais', 'O helicóptero só pousa em chão quase plano. Procure um trecho reto ou uma plataforma.']);
    if (ship.vy > vyMax()) problems.push(['descida rápida demais (' + fmt(ship.vy / M) + ' m/s)', heli ? 'Segure o rotor até o número da Descida ficar verde antes de tocar o chão.' : 'Comece a frear mais alto e segure o motor até o número da Descida ficar verde.']);
    if (Math.abs(ship.vx) > vxMax()) problems.push(['deslizando de lado (' + fmt(Math.abs(ship.vx) / M) + ' m/s)', windMax() ? 'Com vento, incline um pouco contra ele até a velocidade Lateral zerar.' : 'Antes de descer, incline contra o movimento até a velocidade Lateral zerar.']);
    if (Math.abs(ship.a) > ANG_MAX) problems.push(['inclinado demais (' + Math.round(Math.abs(ship.a) * 180 / Math.PI) + '°)', heli ? 'Solte as setas para o helicóptero se nivelar antes de tocar o chão.' : 'Deixe a nave em pé (inclinação perto de 0°) nos últimos metros.']);
    if (problems.length) return crash(problems);

    const touch = ship.vy, perfect = ship.vy <= 9 && Math.abs(ship.vx) <= 5 && Math.abs(ship.a) <= 3 * Math.PI / 180;
    ship.a = 0; ship.av = 0; ship.vx = 0; ship.vy = 0; ship.thrusting = false;
    touchdownDust();
    if (!heli) { ship.y = pad.y - FOOT_Y; return landLander(pad, touch, perfect); }
    ship.y = Math.min(terrainY(ship.x - fx), terrainY(ship.x + fx)) - FOOT_Y;
    ship.grounded = true;
    if (pad && pad.kind === 'dest' && !targetsLeft()) {
      const rows = [['Velocidade no toque', fmt(touch / M) + ' m/s'], ['Fotos', targets.length + ' de ' + targets.length], ['Pouso no destino', '100'], ['Bateria restante', '+' + Math.round(ship.fuel * 2)]];
      if (perfect) rows.push(['Toque suave', '+50']);
      finishMap(perfect ? 'Pouso perfeito' : 'Voo concluído', rows, 100 + Math.round(ship.fuel * 2) + (perfect ? 50 : 0));
    }
  }

  function landLander(pad, touch, perfect) {
    const base = 100, fuelBonus = Math.round(ship.fuel * 2), soft = perfect ? 50 : 0;
    const rows = [['Velocidade no toque', fmt(touch / M) + ' m/s'], ['Pouso', String(base)], ['Combustível restante', '+' + fuelBonus]];
    if (perfect) rows.push(['Toque suave', '+' + soft]);
    const used = !!pad.used;
    rows.push(used ? ['Plataforma', 'já usada: sem pontos'] : ['Plataforma', '×' + pad.mult]);
    pad.used = true;
    const more = pads.some(p => !p.used);
    finishMap(perfect ? 'Pouso perfeito' : 'Pouso confirmado', rows, used ? 0 : (base + fuelBonus + soft) * pad.mult,
      more ? { label: 'Decolar para outra plataforma', fn: relaunch } : null,
      more ? ' Você pode decolar de novo com +30 de combustível e pontuar em outra plataforma, mas uma queda custa uma nave.' : '');
  }
  function relaunch() {
    state = 'play'; stateTime = 0; panel.hidden = true; choices = [];
    $('go').blur(); $('alt').blur(); $('legend').hidden = false;
    ship.fuel = Math.min(fuelMax(), ship.fuel + 30);
    ship.y -= 3; ship.vy = -34;
    showBanner('', 'Decolando: +30 de combustível. Acione o motor!', 2.5);
  }
  function touchdownDust() {
    const gy = terrainY(ship.x);
    for (let i = 0; i < 16; i++) { const d = i % 2 ? 1 : -1; sparks.push({ x: ship.x + d * rand(4, 14), y: gy - 1, vx: d * rand(30, 110), vy: -rand(4, 30), life: rand(0.4, 0.8), t: 0, c: COL.dim }); }
  }

  // rover: uma partícula que rola sobre o terreno; pula, voa nas rampas e precisa pousar inteiro
  function updateRover(dt) {
    const d = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    const yl = terrainY(ship.x - 13), yr = terrainY(ship.x + 13);
    const th = Math.atan2(yr - yl, 26), tx = Math.cos(th), ty = Math.sin(th), nx = ty, ny = -tx;   // tangente e normal do chão
    const sand = ship.grounded && zoneAt(ship.x, 'sand');
    const inStorm = stormX !== null && ship.x < stormX;
    const was = ship.grounded;
    if (d) usedTurn += dt;

    // pulo: um toque, só com as rodas no chão
    if (jumpBuf > 0 && ship.grounded && ship.fuel > 0) {
      jumpBuf = 0;
      ship.vy = Math.min(ship.vy, 0) - 98; ship.y -= 3; ship.grounded = false;
      ship.fuel = Math.max(0, ship.fuel - 1.2); usedThrust += 1;
      beep(330, 0.06); beep(520, 0.08, 0.05);
      for (let i = 0; i < 8; i++) sparks.push({ x: ship.x + rand(-12, 12), y: ship.y, vx: rand(-60, 60), vy: -rand(5, 30), life: 0.4, t: 0, c: COL.dim });
    }
    jumpBuf -= dt;

    ship.vy += gravity() * dt;
    ship.thrusting = false; ship.drill = false;
    if (ship.grounded) {
      if (d && ship.fuel > 0) {
        const a = thrust() * tx * (sand ? 0.6 : 1) * (inStorm ? 0.7 : 1) * (hard ? 0.85 : 1) * d;
        ship.vx += a * tx * dt; ship.vy += a * ty * dt;
        ship.fuel = Math.max(0, ship.fuel - burnRate() * (sand ? 1.3 : 1) * dt);
        ship.thrusting = true;
        if (Math.random() < (sand ? 0.8 : 0.3)) sparks.push({ x: ship.x - d * 14, y: ship.y - 2, vx: -d * rand(20, 70), vy: -rand(8, 40), life: rand(0.3, 0.6), t: 0, c: COL.dim });
      }
      const k = Math.exp(-((d ? 0.5 : 1.8) + (sand ? 0.9 : 0)) * dt);     // atrito; sem acelerar, o rover freia
      ship.vx *= k; ship.vy *= k;
    } else if (d) ship.vx += d * 45 * dt;              // um pouco de controle no ar
    const sp = Math.hypot(ship.vx, ship.vy);
    if (sp > 175 && ship.grounded) { ship.vx *= 175 / sp; ship.vy *= 175 / sp; }
    ship.x += ship.vx * dt; ship.y += ship.vy * dt;
    if (ship.x < 20) { ship.x = 20; ship.vx = Math.max(ship.vx, 0); }
    if (ship.x > W - 20) { ship.x = W - 20; ship.vx = Math.min(ship.vx, 0); }

    const gy = terrainY(ship.x);
    if (ship.y >= gy - 0.5) {
      if (zoneAt(ship.x, 'pit')) { ship.y = gy; return crash([['caiu numa fenda', coarse ? 'Toque em PULO na beirada da fenda, com o rover em movimento.' : 'Aperte ↑ na beirada da fenda, com o rover em movimento.']]); }
      const vn = ship.vx * nx + ship.vy * ny;          // negativo = entrando no chão
      if (vn < 0) {
        const lim = impactMax() * (was ? 1.7 : 1);
        if (-vn > lim) { ship.y = gy; return crash([[was ? 'bateu forte numa subida' : 'queda alta demais', 'Quedas de muito alto quebram a suspensão. A melhoria Suspensão reforçada aguenta mais.']]); }
        if (!was && -vn > 60) { beep(140, 0.08); for (let i = 0; i < 6; i++) sparks.push({ x: ship.x + rand(-12, 12), y: gy - 1, vx: rand(-50, 50), vy: -rand(10, 40), life: 0.5, t: 0, c: COL.dim }); }
        ship.vx -= vn * nx; ship.vy -= vn * ny;
      }
      ship.y = gy; ship.grounded = true;
    } else ship.grounded = gy - ship.y < 3;
    if (ship.grounded) {
      if (airT > 0.9) { addScore(Math.round(airT * 40), ship.x, ship.y - 40, 'salto'); beep(990, 0.08); }   // tempo no ar vale pontos
      airT = 0;
      ship.a += (th - ship.a) * Math.min(1, dt * 12);
    } else airT += dt;
    setEngine(ship.thrusting ? 0.22 : 0);

    collectItems();
    // coleta: basta frear sobre o ponto, a broca desce sozinha
    const speed = Math.hypot(ship.vx, ship.vy);
    for (const t of targets) {
      if (t.done || Math.abs(t.x - ship.x) > 24 || !ship.grounded || speed > 32) continue;
      ship.drill = true; t.prog += dt / 0.9;
      if (Math.random() < 0.6) sparks.push({ x: t.x + rand(-3, 3), y: terrainY(t.x) - 1, vx: rand(-40, 40), vy: -rand(20, 70), life: 0.4, t: 0, c: astro.pal.line });
      if (t.prog >= 1) {
        t.done = true; addScore(150, t.x, terrainY(t.x) - 30, 'amostra'); beep(700, 0.08); beep(1050, 0.12, 0.09);
        if (!targetsLeft()) showBanner('', 'Amostras completas: corra para o DEPÓSITO, no fim do mapa.', 3.5);
      }
    }
    if (ship.fuel > 0 && ship.fuel < 20) { alarmT -= dt; if (alarmT <= 0) { beep(440, 0.07); alarmT = 0.9; } }

    // tempestade de areia: avança sem parar e suga a energia de quem fica dentro dela
    if (stormX !== null) {
      stormX += roverHaz().storm[mapIdx] * (easy ? 0.8 : 1) * dt;
      if (inStorm) {
        ship.fuel = Math.max(0, ship.fuel - 14 * dt);
        if (ship.fuel <= 0) return crash([['engolido pela tempestade de areia', 'A tempestade vem da esquerda e aparece no radar: não pare por muito tempo nem volte atrás.']]);
      }
    }
    updateBoulders(dt);

  // pedras que rolam contra o rover: é preciso pular por cima
  function updateBoulders(dt) {
    const every = roverHaz().boulder ? roverHaz().boulder[mapIdx] * (easy ? 1.4 : 1) : 0;
    if (every && ship.x < depot.x0 - 330) {

    for (const b of boulders) {

      if (state === 'play' && Math.hypot(b.x - ship.x, by - (ship.y - 12)) < b.r + 12) {
        b.dead = true;

  function completePhase() {
