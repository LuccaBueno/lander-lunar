    let x = ship.x, y = ship.y + FOOT_Y, vx = ship.vx, vy = ship.vy;
    if (terrainY(x) - y < 30) return;
    const g = gravity(), h = 0.1, wind = windNow(), k = astro.drag ? Math.exp(-astro.drag * h) : 1, fx = footX();
    ctx.fillStyle = COL.bone;
    for (let i = 1; i <= 60; i++) {
      vx += wind * h; vy += g * h; vx *= k; vy *= k; x += vx * h; y += vy * h;
      if (x < 14) { x = 14; vx = 0; } else if (x > W - 14) { x = W - 14; vx = 0; }
      const gy = terrainY(x);
      if (y >= gy) {
        const onPad = pads.some(p => x - fx >= p.x0 && x + fx <= p.x1);
        ctx.strokeStyle = onPad ? COL.ok : liquidAt(x) ? COL.bad : COL.dim; ctx.globalAlpha = 0.9; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(x - 5, gy - 5); ctx.lineTo(x + 5, gy + 5); ctx.moveTo(x + 5, gy - 5); ctx.lineTo(x - 5, gy + 5); ctx.stroke();
        break;
      }
      if (i % 3 === 0 && i > 3) { ctx.globalAlpha = Math.max(0.12, 0.5 - i * 0.007); ctx.fillRect(x - 1, y - 1, 2, 2); }
    }
    ctx.globalAlpha = 1;
  }

  function drawMinimap() {
    if (W <= viewW * 1.04 || state === 'title') return;
    const mw = Math.min(340, cw - 40), mh = 30, mx = (cw - mw) / 2, my = hudH + 6;
    const sx = mw / W, sy = mh / (H * 0.62);
    const my2 = y => clamp(my + mh - (H - y) * sy, my - 2, my + mh);
    ctx.fillStyle = 'rgba(23,26,39,.8)'; ctx.fillRect(mx - 6, my - 4, mw + 12, mh + 10);
    ctx.beginPath();
    for (let i = 0; i < heights.length; i++) { const x = mx + i * seg * sx, y = my + mh - heights[i] * sy; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.strokeStyle = COL.dim; ctx.lineWidth = 1; ctx.stroke();
    for (const z of zones) {
      ctx.fillStyle = z.type === 'lake' ? '#3f8f9b' : z.type === 'sand' ? COL.dim : COL.bad;
      ctx.fillRect(mx + z.x0 * sx, my2(terrainY((z.x0 + z.x1) / 2)) - 1, Math.max(2, (z.x1 - z.x0) * sx), 2);
    }
    ctx.fillStyle = COL.amber;
    for (const p of pads) ctx.fillRect(mx + p.x0 * sx, my2(p.y) - 1.5, Math.max(4, (p.x1 - p.x0) * sx), 3);
    if (depot) ctx.fillRect(mx + depot.x0 * sx, my2(terrainY(depot.x)) - 1.5, 6, 3);
    for (const t of targets) { ctx.fillStyle = t.done ? COL.ok : COL.amber; ctx.fillRect(mx + t.x * sx - 1.5, my2(terrainY(t.x)) - 7, 3, 5); }
    for (const it of items) {
      if (it.got) continue;
      ctx.fillStyle = it.type === 'gem' ? COL.bone : COL.amber;
      ctx.fillRect(mx + it.x * sx - 1, my2(it.y) - 1, 2, 2);
    }
    ctx.fillStyle = COL.bad;
    for (const b of boulders) ctx.fillRect(mx + b.x * sx - 1.5, my2(terrainY(b.x)) - 4, 3, 3);
    if (stormX !== null && stormX > 0) { ctx.globalAlpha = 0.35; ctx.fillRect(mx, my - 2, Math.min(mw, stormX * sx), mh + 6); ctx.globalAlpha = 1; }
    ctx.fillStyle = COL.amber;
    for (const m of meteors) ctx.fillRect(mx + clamp(m.x, 0, W) * sx - 1, my2(m.y) - 1, 2, 2);
    const vw = viewW / cam.z, vx0 = clamp(cam.x - vw / 2, 0, W), vx1 = clamp(cam.x + vw / 2, 0, W);
    ctx.strokeStyle = 'rgba(233,228,214,.35)';
    ctx.strokeRect(mx + vx0 * sx, my - 2.5, (vx1 - vx0) * sx, mh + 7);
    if (ship.alive) { ctx.fillStyle = COL.bone; ctx.fillRect(mx + ship.x * sx - 2, my2(ship.y) - 2, 4, 4); }
  }

  // o que se vê no céu de cada astro
  function drawSky() {
    ctx.lineWidth = 1.2; ctx.strokeStyle = COL.dim; ctx.fillStyle = 'rgba(139,143,163,.22)';
    const x = W * 0.82, y = 125, id = astro.id;
    if (id === 'lua') {                                // a Terra, meio iluminada
      ctx.beginPath(); ctx.arc(x, y, 26, 0, 6.2832); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, 26, -Math.PI / 2, Math.PI / 2);
      ctx.ellipse(x, y, 9, 26, 0, Math.PI / 2, -Math.PI / 2, true); ctx.fill();
    } else if (astro.pal === MARS) {                   // Fobos e Deimos
      ctx.beginPath(); ctx.arc(x, y, 6, 0, 6.2832); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(x - 150, y + 60, 3, 0, 6.2832); ctx.fill(); ctx.stroke();
    } else if (id === 'europa' || id === 'io') {       // Júpiter e suas faixas
      const r = 95;
      ctx.beginPath(); ctx.arc(x, y + 20, r, 0, 6.2832); ctx.stroke();
      ctx.beginPath();
      for (const dy of [-60, -28, 8, 40, 68]) { const hw = Math.sqrt(r * r - dy * dy); ctx.moveTo(x - hw, y + 20 + dy); ctx.lineTo(x + hw, y + 20 + dy); }
      ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.ellipse(x + 30, y + 46, 16, 8, 0, 0, 6.2832); ctx.stroke();
    } else if (id === 'tita') {                        // Saturno e os anéis
      ctx.beginPath(); ctx.arc(x, y, 44, 0, 6.2832); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(x, y, 92, 15, -0.32, 0, 6.2832); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(x, y, 74, 11, -0.32, 0, 6.2832); ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1;
    } else {                                           // Mercúrio: o Sol enorme
      const sx = W * 0.2, r = 78;
      ctx.strokeStyle = COL.amber; ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.arc(sx, y, r, 0, 6.2832); ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i < 24; i++) { const an = i * 0.2618 + time * 0.03, r2 = r + (i % 2 ? 16 : 26); ctx.moveTo(sx + Math.cos(an) * (r + 8), y + Math.sin(an) * (r + 8)); ctx.lineTo(sx + Math.cos(an) * r2, y + Math.sin(an) * r2); }
      ctx.stroke(); ctx.globalAlpha = 1;
    }
  }

  function drawZones(pal) {
    for (const z of zones) {
      const y = terrainY((z.x0 + z.x1) / 2), wd = z.x1 - z.x0;
      if (z.type === 'lake' || z.type === 'lava') {
        const lava = z.type === 'lava';
        ctx.fillStyle = lava ? '#b8431c' : '#1f4f58';
        ctx.fillRect(z.x0 - 2, y - 2, wd + 4, 13);
        ctx.strokeStyle = lava ? '#ff8a3c' : '#5fb6c2'; ctx.lineWidth = 2;
        ctx.globalAlpha = lava && !REDUCED ? 0.75 + 0.25 * Math.sin(time * 6 + z.x0) : 1;
        ctx.beginPath();
        for (let x = z.x0 - 2; x <= z.x1 + 2; x += 6) { const yy = y - 2 + (REDUCED ? 0 : Math.sin(x * 0.12 + time * (lava ? 1.5 : 3)) * 1.3); x === z.x0 - 2 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy); }
        ctx.stroke(); ctx.globalAlpha = 1;
      } else if (z.type === 'sand') {
        ctx.fillStyle = pal.line; ctx.globalAlpha = 0.6;
        for (let x = z.x0; x < z.x1; x += 6) { const yy = terrainY(x); ctx.fillRect(x, yy + 3 + (x * 7) % 5, 1.5, 1.5); ctx.fillRect(x + 3, yy + 9 + (x * 3) % 6, 1.5, 1.5); }
        ctx.globalAlpha = 1;
      } else {                                         // fenda: placa de aviso antes dela
        const sx = z.x0 - 26, sy = terrainY(sx);
        ctx.strokeStyle = COL.amber; ctx.lineWidth = 1.3; ctx.fillStyle = COL.amber;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy - 12); ctx.moveTo(sx - 7, sy - 12); ctx.lineTo(sx, sy - 25); ctx.lineTo(sx + 7, sy - 12); ctx.closePath(); ctx.stroke();
        ctx.fillRect(sx - 0.7, sy - 21, 1.4, 5); ctx.fillRect(sx - 0.7, sy - 15, 1.4, 1.4);
      }
    }
  }

  function drawObjectives(pal) {
    ctx.textAlign = 'center';
    for (const t of targets) {
      const gy = terrainY(t.x), c = t.done ? COL.ok : COL.amber;
      ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 1.4;
      if (mode === 'heli') {                           // afloramento a fotografar e a zona onde pairar
        ctx.beginPath(); ctx.moveTo(t.x - 9, gy); ctx.lineTo(t.x - 3, gy - 11); ctx.lineTo(t.x + 4, gy - 6); ctx.lineTo(t.x + 9, gy); ctx.stroke();
        const cy = gy - 75;
        ctx.globalAlpha = t.done ? 0.35 : 0.8; ctx.setLineDash([5, 6]);
        ctx.beginPath(); ctx.arc(t.x, cy, 64, 0, 6.2832); ctx.stroke(); ctx.setLineDash([]);
        if (!t.done && t.prog > 0) { ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(t.x, cy, 64, -Math.PI / 2, -Math.PI / 2 + t.prog * 6.2832); ctx.stroke(); }
        ctx.font = '600 11px "IBM Plex Mono", monospace'; ctx.textBaseline = 'middle';
        ctx.fillText(t.done ? 'FOTO ✓' : 'FOTO', t.x, cy);
        ctx.globalAlpha = 1;
      } else {                                         // ponto de coleta
        ctx.beginPath(); ctx.moveTo(t.x - 8, gy - 26); ctx.lineTo(t.x + 8, gy - 26); ctx.lineTo(t.x, gy - 14); ctx.closePath();
        t.done ? ctx.stroke() : ctx.fill();
        ctx.beginPath(); ctx.moveTo(t.x - 18, gy + 4); ctx.lineTo(t.x + 18, gy + 4); ctx.stroke();
        if (!t.done && t.prog > 0) { ctx.fillRect(t.x - 16, gy - 36, 32 * t.prog, 3); ctx.strokeRect(t.x - 16, gy - 36, 32, 3); }
        if (t.done) { ctx.font = '600 11px "IBM Plex Mono", monospace'; ctx.textBaseline = 'middle'; ctx.fillText('✓', t.x, gy - 36); }
      }
    }
    if (depot) {                                       // depósito: bandeira no fim do mapa
      const gy = terrainY(depot.x), ready = !targetsLeft();
      ctx.strokeStyle = COL.amber; ctx.fillStyle = COL.amber; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(depot.x0, gy + 1); ctx.lineTo(W - seg, gy + 1); ctx.stroke();
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(depot.x, gy); ctx.lineTo(depot.x, gy - 44); ctx.lineTo(depot.x + 20, gy - 37); ctx.lineTo(depot.x, gy - 30); ctx.stroke();
      ctx.font = '600 12px "IBM Plex Mono", monospace'; ctx.textBaseline = 'top';
      ctx.globalAlpha = ready ? 1 : 0.6;
      ctx.fillText('DEPÓSITO', depot.x, gy + 10); ctx.globalAlpha = 1;
    }
  }

  function drawVehicle(pal) {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    if (ship.shield) {
      ctx.strokeStyle = COL.ok; ctx.globalAlpha = 0.55; ctx.lineWidth = 1; ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.arc(0, 1, 22, 0, 6.2832); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    ctx.rotate(ship.a);
    ctx.strokeStyle = COL.bone; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.fillStyle = pal.sky;
    if (mode === 'heli') {
      ctx.beginPath(); ctx.rect(-6, -3, 12, 9); ctx.fill(); ctx.stroke();                  // corpo
      ctx.beginPath();
      ctx.moveTo(-5, 6); ctx.lineTo(-10, FOOT_Y); ctx.moveTo(5, 6); ctx.lineTo(10, FOOT_Y);  // pernas
      ctx.moveTo(-13, FOOT_Y); ctx.lineTo(-7, FOOT_Y); ctx.moveTo(7, FOOT_Y); ctx.lineTo(13, FOOT_Y);
      ctx.moveTo(0, -3); ctx.lineTo(0, -13);                                               // mastro
      ctx.moveTo(-5, -15); ctx.lineTo(5, -15);                                             // painel solar
      ctx.stroke();
      // dois rotores girando em sentidos opostos; quanto mais rápido, mais borrados
      const rpm = ship.rpm, R = 18;
      const r1 = REDUCED ? R : 2 + (R - 2) * Math.abs(Math.cos(ship.rot)), r2 = REDUCED ? R * 0.8 : 2 + (R - 2) * Math.abs(Math.cos(ship.rot * 1.07 + 1.2));
      if (rpm > 0.35) {
        ctx.strokeStyle = COL.amber; ctx.globalAlpha = 0.28 * rpm; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(-R, -10); ctx.lineTo(R, -10); ctx.moveTo(-R, -12.5); ctx.lineTo(R, -12.5); ctx.stroke();
        ctx.globalAlpha = 1; ctx.lineWidth = 1.5;
      }
      ctx.strokeStyle = rpm > 0.5 ? COL.amber : COL.bone;
      ctx.beginPath(); ctx.moveTo(-r1, -10); ctx.lineTo(r1, -10); ctx.moveTo(-r2, -12.5); ctx.lineTo(r2, -12.5); ctx.stroke();
    } else if (mode === 'rover') {                     // origem no ponto de contato com o chão
      ctx.beginPath(); ctx.rect(-15, -18, 30, 8); ctx.fill(); ctx.stroke();                // chassi
      for (const wx of [-13, 0, 13]) { ctx.beginPath(); ctx.arc(wx, -5, 5, 0, 6.2832); ctx.fill(); ctx.stroke(); }
      ctx.beginPath();
      ctx.moveTo(8, -18); ctx.lineTo(8, -29); ctx.moveTo(4, -32); ctx.lineTo(13, -32); ctx.lineTo(13, -28); ctx.lineTo(4, -28); ctx.closePath();   // mastro e câmera
      ctx.moveTo(-15, -15); ctx.lineTo(-21, -21);                                          // gerador
      ctx.stroke();
      if (ship.drill) { ctx.strokeStyle = COL.amber; ctx.beginPath(); ctx.moveTo(15, -14); ctx.lineTo(20, -8); ctx.lineTo(20 + rand(-1, 1), 2); ctx.stroke(); }
    } else {
      ctx.beginPath();   // cabine
      ctx.moveTo(-4, -12); ctx.lineTo(4, -12); ctx.lineTo(9, -6); ctx.lineTo(9, 0); ctx.lineTo(4, 4); ctx.lineTo(-4, 4); ctx.lineTo(-9, 0); ctx.lineTo(-9, -6); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.rect(-8, 4, 16, 5); ctx.fill(); ctx.stroke();   // estágio de descida
      ctx.beginPath();   // pernas, sapatas e bocal
      ctx.moveTo(-8, 6); ctx.lineTo(-12, FOOT_Y); ctx.moveTo(8, 6); ctx.lineTo(12, FOOT_Y);
      ctx.moveTo(-15, FOOT_Y); ctx.lineTo(-9, FOOT_Y); ctx.moveTo(9, FOOT_Y); ctx.lineTo(15, FOOT_Y);
      ctx.moveTo(-2.5, 9); ctx.lineTo(-4, 12.5); ctx.lineTo(4, 12.5); ctx.lineTo(2.5, 9);
      ctx.stroke();
      if (ship.thrusting) {
        const L = (16 + Math.random() * 12) * (1 + 0.08 * up().engine);
        ctx.strokeStyle = COL.amber;
        ctx.beginPath(); ctx.moveTo(-3.5, 13); ctx.lineTo(0, 13 + L); ctx.lineTo(3.5, 13); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawWorld() {
    const pal = astro.pal;
    ctx.fillStyle = pal.sky;
    ctx.fillRect(0, 0, cw, ch);

    ctx.save();
    const k = scale * cam.z;
    const sx = shake ? rand(-1, 1) * shake * 6 : 0, sy = shake ? rand(-1, 1) * shake * 6 : 0;
    ctx.translate(cw / 2 + sx, ch / 2 + sy);
    ctx.scale(k, k);
    ctx.translate(-cam.x, -cam.y);
    const left = cam.x - cw / (2 * k) - 20, right = cam.x + cw / (2 * k) + 20;

    // estrelas (bem mais fracas onde há atmosfera densa)
    ctx.fillStyle = COL.bone;
    const dimSky = astro.drag ? 0.35 : 1;
    for (const s of stars) {
      if (s.x < left || s.x > right || s.y > terrainY(s.x)) continue;
      ctx.globalAlpha = (s.tw && !REDUCED ? 0.45 + 0.4 * Math.sin(time * 1.7 + s.p) : 0.7) * dimSky;
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;
    drawSky();

    // vento: riscos que correm na direção e na força do momento
    if (windMax()) {
      const wn = windNow(), span = right - left + 200, len = clamp(wn * 1.6, -34, 34);
      ctx.strokeStyle = pal.line; ctx.lineWidth = 1; ctx.globalAlpha = 0.28;
      ctx.beginPath();
      for (const d of dust) {
        const x = left - 100 + (((d.a * span + windPos * d.s) % span) + span) % span;
        ctx.moveTo(x, d.y); ctx.lineTo(x - len * d.s, d.y);
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    }

    // terreno (continua plano além dos limites do mapa)
    const n = heights.length - 1, y0 = H - heights[0], yN = H - heights[n];
    ctx.beginPath();
    ctx.moveTo(-3000, H + 3000); ctx.lineTo(-3000, y0);
    for (let i = 0; i <= n; i++) ctx.lineTo(i * seg, H - heights[i]);
    ctx.lineTo(W + 3000, yN); ctx.lineTo(W + 3000, H + 3000); ctx.closePath();
    ctx.fillStyle = pal.ground; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-3000, y0);
    for (let i = 0; i <= n; i++) ctx.lineTo(i * seg, H - heights[i]);
    ctx.lineTo(W + 3000, yN);
    ctx.strokeStyle = pal.line; ctx.lineWidth = 1.4; ctx.lineJoin = 'round'; ctx.stroke();
    drawZones(pal);
    if (stormX !== null) {                             // tempestade: parede de areia vindo da esquerda
      ctx.fillStyle = pal.line; ctx.globalAlpha = 0.2;
      ctx.fillRect(left - 400, -600, stormX - left + 400, H + 1200);
      ctx.globalAlpha = 0.14; ctx.fillRect(stormX, -600, 26, H + 1200);
      ctx.strokeStyle = pal.line; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.55;
      ctx.beginPath();
      for (let i = 0; i < 46; i++) {
        const x = stormX + 20 - ((i * 97 + (REDUCED ? 0 : time * 260)) % 620), y = 30 + (i * 53) % 640;
        ctx.moveTo(x, y); ctx.lineTo(x - 30, y + 3);
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    }

    // limites da área
    ctx.strokeStyle = COL.dim; ctx.globalAlpha = 0.35; ctx.lineWidth = 1; ctx.setLineDash([2, 8]);
    ctx.beginPath(); ctx.moveTo(0, -400); ctx.lineTo(0, y0); ctx.moveTo(W, -400); ctx.lineTo(W, yN); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;

    // plataformas
    ctx.font = '600 13px "IBM Plex Mono", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (const p of pads) {
      const dimmed = (p.kind === 'dest' && targetsLeft()) || p.used;
      ctx.globalAlpha = dimmed ? 0.5 : 1;
      ctx.strokeStyle = COL.amber; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(p.x0, p.y); ctx.lineTo(p.x1, p.y); ctx.stroke();
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(p.x0, p.y); ctx.lineTo(p.x0, p.y - 7); ctx.moveTo(p.x1, p.y); ctx.lineTo(p.x1, p.y - 7); ctx.stroke();
      ctx.fillStyle = COL.amber;
      ctx.fillText(p.used ? p.label + ' ✓' : p.label, (p.x0 + p.x1) / 2, p.y + 9);
      if (p.kind !== 'base' && !p.used && (REDUCED || Math.sin(time * 5 + p.x0) > 0)) {
        ctx.fillRect(p.x0 - 1.5, p.y - 11, 3, 3); ctx.fillRect(p.x1 - 1.5, p.y - 11, 3, 3);
      }
      ctx.globalAlpha = 1;
    }
    drawObjectives(pal);

    // itens: estrela (pontos) e cápsula F (combustível / energia)
    ctx.textAlign = 'center';
    for (const it of items) {
      if (it.got) continue;
      const x = it.x, y = it.y + (REDUCED ? 0 : Math.sin(time * 2 + it.p) * (mode === 'rover' ? 2 : 4));
      ctx.lineWidth = 1.4; ctx.fillStyle = pal.sky;
      ctx.beginPath();
      if (it.type === 'fuel') {
        ctx.moveTo(x, y - 12); ctx.lineTo(x + 9, y); ctx.lineTo(x, y + 12); ctx.lineTo(x - 9, y); ctx.closePath();
        ctx.strokeStyle = COL.amber; ctx.fill(); ctx.stroke();
        ctx.fillStyle = COL.amber; ctx.font = '600 10px "IBM Plex Mono", monospace'; ctx.textBaseline = 'middle';
        ctx.fillText('F', x, y + 0.5);
      } else if (it.type === 'ring') {
        ctx.strokeStyle = COL.amber; ctx.lineWidth = 2;
        ctx.save(); ctx.translate(x, y); if (!REDUCED) ctx.rotate(time * 0.8 + it.p);
        ctx.setLineDash([9, 5]); ctx.arc(0, 0, 20, 0, 6.2832); ctx.stroke(); ctx.restore();
      } else {
        for (let i = 0; i < 8; i++) {
          const an = i * Math.PI / 4 - Math.PI / 2, rr = i % 2 ? 4 : 11;
          const px = x + Math.cos(an) * rr, py = y + Math.sin(an) * rr;
          i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.closePath(); ctx.strokeStyle = COL.bone; ctx.fill(); ctx.stroke();
      }
    }
    ctx.font = '600 12px "IBM Plex Mono", monospace'; ctx.textBaseline = 'middle';
    for (const f of floats) { ctx.globalAlpha = clamp(1.5 - f.t, 0, 1); ctx.fillStyle = f.c; ctx.fillText(f.text, f.x, f.y - 16); }
    ctx.globalAlpha = 1;

    if (ship.alive && state === 'play' && !hard && mode === 'lander') drawTrajectory();

    // meteoros e rochas vulcânicas
    for (const m of meteors) {
      ctx.strokeStyle = COL.amber; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * 0.22, m.y - m.vy * 0.22); ctx.stroke();
      ctx.globalAlpha = 1; ctx.strokeStyle = m.grav ? COL.amber : COL.bone; ctx.fillStyle = pal.sky; ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const an = m.a + i * 1.0472, rr = m.r * (i % 2 ? 0.75 : 1.1);
        const px = m.x + Math.cos(an) * rr, py = m.y + Math.sin(an) * rr;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }

    // chama, poeira e faíscas
    for (const s of sparks) {
      ctx.globalAlpha = 1 - s.t / s.life;
      ctx.fillStyle = s.c || COL.amber; ctx.fillRect(s.x - 1, s.y - 1, 2, 2);
    }
    ctx.globalAlpha = 1;

    for (const b of boulders) {                        // pedras rolando
      const by = terrainY(b.x) - b.r;
      ctx.strokeStyle = COL.bone; ctx.fillStyle = pal.ground; ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < 7; i++) { const an = b.a + i * 0.8976, rr = b.r * (i % 2 ? 0.82 : 1.08); const px = b.x + Math.cos(an) * rr, py = by + Math.sin(an) * rr; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    if (ship.alive) drawVehicle(pal);

    // destroços
    ctx.strokeStyle = COL.bone; ctx.lineWidth = 1.5;
    for (const f of frags) {
      ctx.globalAlpha = clamp(1.6 - f.t / 2.5, 0.25, 1);
      const dx = Math.cos(f.a) * f.len / 2, dy = Math.sin(f.a) * f.len / 2;
      ctx.beginPath(); ctx.moveTo(f.x - dx, f.y - dy); ctx.lineTo(f.x + dx, f.y + dy); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // em coordenadas de tela: seta quando o veículo sai pelo topo, situação do pouso e radar
    if (ship.alive && mode !== 'rover') {
      const px = (ship.x - cam.x) * k + cw / 2, py = (ship.y - cam.y) * k + ch / 2;
      if (py < hudH - 10) {
        const ty = hudH + 46;
        ctx.fillStyle = COL.bone;
        ctx.beginPath(); ctx.moveTo(px, ty); ctx.lineTo(px - 7, ty + 12); ctx.lineTo(px + 7, ty + 12); ctx.closePath(); ctx.fill();
      }
      if (state === 'play' && !ship.grounded && terrainY(ship.x) - (ship.y + FOOT_Y) < 230) {
        const fx = footX();
        const overPad = pads.some(p => ship.x - fx >= p.x0 && ship.x + fx <= p.x1);
        const flatGround = Math.abs(terrainY(ship.x + fx) - terrainY(ship.x - fx)) / (2 * fx) <= 0.4;
        let msg = mode === 'heli' ? 'PRONTO PARA POUSAR' : 'PRONTA PARA POUSAR', c = COL.ok;
        if (ship.vy > vyMax()) { msg = 'DESCIDA RÁPIDA'; c = COL.amber; }
        else if (Math.abs(ship.vx) > vxMax()) { msg = 'DESLIZANDO DE LADO'; c = COL.amber; }
        else if (Math.abs(ship.a) > ANG_MAX) { msg = mode === 'heli' ? 'INCLINADO' : 'INCLINADA'; c = COL.amber; }
        else if (liquidAt(ship.x)) { msg = liquidAt(ship.x).type === 'lava' ? 'LAVA ABAIXO' : 'LAGO ABAIXO'; c = COL.bad; }
        else if (mode === 'heli' ? !flatGround : !overPad) { msg = mode === 'heli' ? 'TERRENO INCLINADO' : 'SEM PLATAFORMA ABAIXO'; c = COL.dim; }
        const rightSide = px < cw - 230;
        ctx.font = '600 11px "IBM Plex Mono", monospace'; ctx.textBaseline = 'middle';
        ctx.textAlign = rightSide ? 'left' : 'right'; ctx.fillStyle = c;
        ctx.fillText(msg, px + (rightSide ? 1 : -1) * 28 * k, py - 2);
      }
    }
    drawMinimap();
  }

  // Mapa de fases: uma rota na ordem em que elas são liberadas
  function drawMap() {
    ctx.fillStyle = COL.void;
    ctx.fillRect(0, 0, cw, ch);
    ctx.fillStyle = COL.bone;
    for (const s of stars) {
      const x = (((s.x + 700) / (W + 1400)) * cw), y = ((s.y + 350) / (H * 0.8 + 350)) * ch;
      ctx.globalAlpha = s.tw && !REDUCED ? 0.4 + 0.35 * Math.sin(time * 1.7 + s.p) : 0.55;
      ctx.fillRect(x, y, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    const list = phases(), sv = S(), small = cw < 640, n = list.length;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = COL.bone; ctx.font = '400 ' + (small ? 17 : 22) + 'px Michroma, "Trebuchet MS", sans-serif';
    ctx.fillText(MODES[mode].chart, 20, small ? 38 : 46);
    ctx.fillStyle = COL.dim; ctx.font = '400 12px "IBM Plex Mono", monospace';
    const total = list.reduce((t, a) => t + (sv.best[a.id] || 0), 0);
    const doneCount = list.filter(a => sv.best[a.id] !== undefined).length;
    ctx.fillText(doneCount + ' de ' + n + ' fases concluídas · ' + num(total) + ' pontos no total', 20, small ? 58 : 68);
    ctx.fillText(coarse ? 'Toque numa fase para escolher.' : '← → escolhem a fase, Enter inicia.', 20, small ? 76 : 87);

    const span = n > 3 ? 0.8 : 0.5, spacing = cw * span / (n - 1), r = clamp(spacing * 0.3, 13, 38);
    const baseY = clamp(ch * 0.34, 150, ch - 60);
    mapPos = list.map((a, i) => ({ x: cw * (0.5 - span / 2) + spacing * i, y: baseY + Math.sin(i * 1.25 + 0.4) * Math.min(ch * 0.07, 46), r }));

    ctx.lineWidth = 1; ctx.setLineDash([3, 7]);
    for (let i = 0; i < n - 1; i++) {
      ctx.strokeStyle = i + 1 < sv.unlocked ? COL.bone : COL.dim; ctx.globalAlpha = i + 1 < sv.unlocked ? 0.6 : 0.3;
      const a = mapPos[i], b = mapPos[i + 1], d = Math.hypot(b.x - a.x, b.y - a.y), ux = (b.x - a.x) / d, uy = (b.y - a.y) / d;
      ctx.beginPath(); ctx.moveTo(a.x + ux * (r + 8), a.y + uy * (r + 8)); ctx.lineTo(b.x - ux * (r + 8), b.y - uy * (r + 8)); ctx.stroke();
    }
    ctx.setLineDash([]); ctx.globalAlpha = 1;

    list.forEach((a, i) => {
      const p = mapPos[i], open = i < sv.unlocked, best = sv.best[a.id];
      ctx.globalAlpha = open ? 1 : 0.38;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832);
      ctx.fillStyle = a.pal.ground; ctx.fill();
      ctx.strokeStyle = a.pal.line; ctx.lineWidth = 1.6; ctx.stroke();
      // relevo típico, dentro do disco
      ctx.save(); ctx.clip(); ctx.lineWidth = 1; ctx.globalAlpha *= 0.7;
      ctx.beginPath();
      const g = a.gen;
      if (g === 'europa') { for (let j = -2; j <= 2; j++) { ctx.moveTo(p.x - r, p.y + j * r * 0.36 + j * 3); ctx.lineTo(p.x + r, p.y + j * r * 0.36 - r * 0.5); } }
      else if (g === 'tita' || g === 'dunes') { for (let j = -2; j <= 2; j++) { const yy = p.y + j * r * 0.36; ctx.moveTo(p.x - r, yy); ctx.bezierCurveTo(p.x - r * 0.4, yy - r * 0.25, p.x + r * 0.2, yy + r * 0.25, p.x + r, yy); } }
      else if (g === 'marte' || g === 'mesa') { ctx.moveTo(p.x - r, p.y + r * 0.3); ctx.lineTo(p.x - r * 0.4, p.y + r * 0.3); ctx.lineTo(p.x - r * 0.4, p.y - r * 0.1); ctx.lineTo(p.x + r * 0.2, p.y - r * 0.1); ctx.lineTo(p.x + r * 0.2, p.y + r * 0.45); ctx.lineTo(p.x + r, p.y + r * 0.45); ctx.moveTo(p.x - r * 0.5, p.y - r * 0.7); ctx.arc(p.x, p.y - r * 1.25, r * 0.75, 2.3, 0.84, true); }
      else if (g === 'io') { for (const dx of [-0.35, 0.35]) { ctx.moveTo(p.x + (dx - 0.35) * r, p.y + r * 0.4); ctx.lineTo(p.x + (dx - 0.08) * r, p.y - r * 0.15); ctx.lineTo(p.x + (dx + 0.08) * r, p.y - r * 0.15); ctx.lineTo(p.x + (dx + 0.35) * r, p.y + r * 0.4); } }
      else { for (let j = 0; j < 4; j++) { const an = i * 1.7 + j * 1.9, d = r * (0.25 + 0.17 * j), cr = r * (0.24 - 0.04 * j); ctx.moveTo(p.x + Math.cos(an) * d + cr, p.y + Math.sin(an) * d); ctx.arc(p.x + Math.cos(an) * d, p.y + Math.sin(an) * d, cr, 0, 6.2832); } }
      ctx.stroke(); ctx.restore();
      ctx.globalAlpha = 1;

      if (i === sel) {
        ctx.save(); ctx.translate(p.x, p.y); if (!REDUCED) ctx.rotate(time * 0.5);
        ctx.strokeStyle = COL.amber; ctx.lineWidth = 1.6; ctx.setLineDash([7, 6]);
        ctx.beginPath(); ctx.arc(0, 0, r + 8, 0, 6.2832); ctx.stroke(); ctx.restore();
      }
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.font = (i === sel ? '600 ' : '500 ') + (small ? 11 : 14) + 'px "IBM Plex Mono", monospace';
      ctx.fillStyle = i === sel ? COL.amber : open ? COL.bone : COL.dim;
      ctx.fillText(a.name, p.x, p.y + r + 14);
      ctx.font = '400 ' + (small ? 10 : 11) + 'px "IBM Plex Mono", monospace';
      ctx.fillStyle = best !== undefined ? COL.ok : COL.dim;
      const status = !open ? 'bloqueado' : best !== undefined ? '✓ ' + num(best) : (sv.done[a.id + '-0'] ? 'mapa 1 ✓' : 'novo');
      ctx.fillText(status, p.x, p.y + r + (small ? 29 : 33));
      if (!small) { ctx.fillStyle = COL.dim; ctx.fillText('fase ' + (i + 1), p.x, p.y - r - 26); }
    });
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (state === 'map') drawMap(); else drawWorld();
  }

  // ---------- Instrumentos ----------
  const setCls = (el, c) => { if (el.dataset.c !== c) { el.dataset.c = c; el.className = 'inst ' + c; } };
  function hud() {
    if (state === 'map') return;
    const rover = mode === 'rover';
    if (rover) {
      const sp = Math.hypot(ship.vx, ship.vy) * Math.sign(ship.vx || 1);
      $('vVx').textContent = fmt(sp / M);
      $('vAng').textContent = Math.round(-ship.a * 180 / Math.PI);
      setCls($('iVx'), ''); setCls($('iAng'), '');
    } else {
      const alt = Math.max(0, terrainY(ship.x) - (ship.y + FOOT_Y)) / M;
      $('vAlt').textContent = Math.round(alt);
      $('vVx').textContent = fmt(ship.vx / M);
      $('vVy').textContent = fmt(ship.vy / M);
      $('vAng').textContent = Math.round(ship.a * 180 / Math.PI);
      $('vVyMax').textContent = fmt(vyMax() / M);
      $('vxMax').textContent = ' · máx ' + fmt(vxMax() / M);
      setCls($('iVx'), Math.abs(ship.vx) <= vxMax() ? 'ok' : 'warn');
      setCls($('iVy'), ship.vy <= vyMax() ? 'ok' : 'warn');
      setCls($('iAng'), Math.abs(ship.a) <= ANG_MAX ? 'ok' : 'warn');
    }
    $('vFuel').textContent = Math.round(ship.fuel);
    $('vFuelMax').textContent = '/ ' + fuelMax();
    $('fuelfill').style.transform = 'scaleX(' + (ship.fuel / fuelMax()).toFixed(3) + ')';
    setCls($('iFuel'), ship.fuel < 20 ? 'bad' : '');
    if (!$('iWind').hidden) {
      const w = windNow() / M, strong = Math.abs(w) > windMax() / M * 0.6;
      $('vWind').textContent = (Math.abs(w) < 0.15 ? '· ' : w > 0 ? '→ ' : '← ') + fmt(Math.abs(w));
      setCls($('iWind'), strong ? 'warn' : '');
    }
    if (mode !== 'lander') {
      $('vObj').textContent = (targets.length - targetsLeft()) + '/' + targets.length;
      setCls($('iObj'), targetsLeft() ? '' : 'ok');
    }
    $('vLevel').textContent = astro.name + ' ' + (mapIdx + 1) + '/' + MAPS;
    $('vLives').textContent = Math.max(lives, 0);
    $('vScore').textContent = num(score);
    $('vBest').textContent = S().best[astro.id] !== undefined ? num(S().best[astro.id]) : '—';
  }

  // ---------- Laço principal ----------
  let prev = 0;
  function frame(ts) {
    const dt = Math.min((ts - prev) / 1000 || 0, 1 / 30);
    prev = ts;
    if (state !== 'paused') update(dt);
    if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.add('off'); }
    draw();
    hud();
    updateTip();
    requestAnimationFrame(frame);
  }

  function start(data) {
    if (data && data.save) { save = mergeSave(save, data.save); persist(); }
    lives = maxLives();
    buildLevel();
    spawnShip();
    showTitle();
    requestAnimationFrame(frame);
  }

  if (window.__LANDER_TEST) window.__lander = {
    info: () => ({ state, mode, astro: astro.id, mapIdx, sel, lives, score, W, seg, viewW, cam: { ...cam }, ship: { ...ship }, meteors: meteors.length,
      save: JSON.parse(JSON.stringify(save)), hard, pads: pads.map(p => ({ ...p })), zones: zones.map(z => ({ ...z })), vents: vents.map(v => ({ ...v, x: v.i * seg })),
      targets: targets.map(t => ({ ...t, y: terrainY(t.x) })), depot, stormX, boulders: boulders.length, diff, heights: heights.slice() }),
    go(m, i, map) { mode = m; save.modes[m].unlocked = MODES[m].phases.length; startPhase(i); if (map) { mapIdx = map; buildLevel(); spawnShip(); } },
    place(x, y, vx = 0, vy = 0) { ship.x = x; ship.y = y === null ? terrainY(x) : y; ship.vx = vx; ship.vy = vy; ship.a = 0; ship.grounded = false; },
    toPad(i) { const p = pads[i]; ship.x = (p.x0 + p.x1) / 2; ship.y = p.y - FOOT_Y - 3; ship.vx = 0; ship.vy = 6; ship.a = 0; ship.grounded = false; },
    ty: x => terrainY(x),
    mapPos: () => mapPos,
  };

  if (TAURI) document.addEventListener('contextmenu', e => e.preventDefault());
  quietUpdateCheck();

  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ save }));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
